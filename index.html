<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dockside: learn Docker and Kubernetes by playing</title>
<style>
:root{
  --bg:#EDF2F4; --surface:#FFFFFF; --ink:#0F2A3D; --muted:#4A6070; --line:#C6D3DA;
  --blue:#2B6CB0; --green:#25775A; --yellow:#E6B22E; --red:#B83A2E; --on-yellow:#1C1500;
  --display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1B27; --surface:#15293A; --ink:#E6EEF3; --muted:#9DB2C0; --line:#2A4256;
    --blue:#3375BF; --green:#2A8566; --yellow:#E6B22E; --red:#C24334;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
code,pre{font-family:var(--mono)}
code{font-size:.92em;background:color-mix(in srgb,var(--ink) 9%,transparent);padding:1px 6px;border-radius:4px}
pre{margin:12px 0;padding:14px 16px;background:color-mix(in srgb,var(--ink) 8%,var(--surface));border:1px solid var(--line);border-radius:6px;overflow:auto;font-size:14px;line-height:1.5}
pre code{background:none;padding:0;font-size:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* top bar */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:800 24px var(--display);letter-spacing:-.01em}
.brand i{display:flex;gap:2px}
.brand i b{display:block;width:10px;height:14px;border-radius:2px}
.brand i b:nth-child(1){background:var(--blue)}
.brand i b:nth-child(2){background:var(--green)}
.brand i b:nth-child(3){background:var(--yellow)}
.score{display:flex;gap:18px;font-size:14px;color:var(--muted)}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* hero */
.hero{padding:44px 0 26px}
.hero h1{font-size:clamp(40px,8vw,76px);font-weight:800;max-width:11em}
.lede{font-size:18px;max-width:34em;color:var(--muted);margin:14px 0 22px}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.flow>div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px;max-width:300px}
.flow b{display:block;font:800 20px var(--display)}
.flow span{font-size:14px;color:var(--muted)}
.flow .then{background:none;border:0;display:flex;align-items:center;color:var(--muted);padding:0 2px}
.loaded{margin:26px 0 8px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.slots8{display:flex;gap:4px}
.slots8 i{width:22px;height:12px;border-radius:2px;background:var(--line)}
.slots8 i.on{background:var(--ink)}

/* level map */
.track{margin:30px 0 8px}
.track h2{font-size:28px;font-weight:800}
.track p{margin:2px 0 14px;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.c-blue{--c:var(--blue);--on:#fff}
.c-green{--c:var(--green);--on:#fff}
.c-yellow{--c:var(--yellow);--on:var(--on-yellow)}
.c-red{--c:var(--red);--on:#fff}
.box{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:160px;padding:26px 16px 20px;border:0;border-bottom:8px solid rgba(0,0,0,.3);border-radius:4px;background:var(--c);color:var(--on);overflow:hidden;transition:transform .12s}
.box::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 3px,transparent 3px 11px);pointer-events:none}
.box::after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:rgba(0,0,0,.3)}
.box>*{position:relative}
.box:hover{transform:translateY(-3px)}
.box .lv{font-size:13px;opacity:.9}
.box .nm{font:800 26px/1.05 var(--display)}
.box .bl{font-size:14px;opacity:.95}
.stamp{position:absolute!important;top:18px;right:12px;transform:rotate(8deg);border:2px solid currentColor;border-radius:3px;padding:0 8px;font:800 14px var(--display);background:rgba(0,0,0,.18)}

/* cheat sheet */
.cheat{margin:44px 0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cheat section{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.cheat h3{font-size:22px;margin-bottom:8px}
.cheat dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.cheat dt{white-space:nowrap}
.cheat dd{margin:0;color:var(--muted)}
.foot{padding:20px 0 40px;color:var(--muted);font-size:13px}

/* level runner */
.runbar{display:flex;align-items:center;gap:14px;padding:22px 0 14px}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.prog{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--ink));transition:width .25s}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{background:var(--surface);border:1px solid var(--line);border-left:12px solid var(--c);border-radius:6px;padding:24px clamp(16px,4vw,32px) 28px;margin-bottom:40px}
.stage .who{font-size:13px;color:var(--muted);margin-bottom:4px}
.stage h2{font-size:34px;font-weight:800;margin-bottom:18px}
.q{font-size:26px;font-weight:800;margin:0 0 14px}
.lesson p,.lesson li{max-width:42em}
.lesson ul{padding-left:20px}
.lesson li{margin:5px 0}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.again{display:inline-block;margin:0 0 10px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--yellow) 35%,transparent);font-size:13px}
.btn{margin-top:18px;padding:11px 22px;border:0;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:none;color:var(--ink);border:2px solid var(--ink);margin-left:10px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:12px}

/* quiz */
.opts{display:grid;gap:10px;max-width:640px}
.opt{text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:6px;background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right,.mt.right,.slot.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--surface))}
.opt.wrong,.mt.wrong,.slot.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--surface))}
.opt:disabled{cursor:default}
.fb{margin-top:16px;max-width:640px}
.fb strong{font:800 20px var(--display)}
.fb p{margin:6px 0 0}

/* order puzzle */
.slots{display:grid;gap:6px;max-width:640px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 12px;border:2px dashed var(--line);border-radius:6px;background:transparent;text-align:left}
.slot.filled{border-style:solid;background:var(--surface)}
.slot .n{width:20px;font-size:13px;color:var(--muted);text-align:right}
.pool{display:flex;flex-wrap:wrap;gap:8px;max-width:640px;min-height:46px}
.chip{padding:8px 12px;border:2px solid var(--ink);border-radius:6px;background:var(--surface)}
.chip:hover{background:color-mix(in srgb,var(--ink) 8%,var(--surface))}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;max-width:760px}
.col{display:grid;gap:10px;align-content:start}
.mt{text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:6px;background:var(--surface);min-height:52px}
.mt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.mt:disabled{cursor:default}
@media (max-width:560px){.match{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.mt.wrong{animation:shake .3s}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* visuals inside lessons */
.stackviz{max-width:420px;margin:16px 0;display:grid;gap:4px;font-size:13px;text-align:center}
.stackviz .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.stackviz .apps span{padding:14px 4px;background:var(--blue);color:#fff;border-radius:3px;border-bottom:5px solid rgba(0,0,0,.3)}
.stackviz .eng{padding:9px;background:color-mix(in srgb,var(--blue) 30%,var(--surface));border-radius:3px}
.stackviz .os{padding:9px;background:var(--line);border-radius:3px}
.clusterviz{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.clusterviz .cn{flex:1 1 130px;max-width:190px;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;font-size:13px}
.clusterviz .pods{display:flex;gap:5px;margin-top:6px}
.clusterviz .pods i{display:block;width:34px;height:20px;background:var(--green);border-radius:2px;border-bottom:4px solid rgba(0,0,0,.3)}
.journey{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;align-items:center;font-size:14px}
.journey span{padding:8px 12px;border-radius:4px;color:#fff;background:var(--blue)}
.journey span.k{background:var(--green)}
.journey em{font-style:normal;color:var(--muted)}

/* kubernetes lab */
.lab .statrow{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin-bottom:14px}
.lab .num{min-width:92px;padding:8px 14px;border:1px solid var(--line);border-radius:6px}
.lab .num b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.lab .num span{font-size:12px;color:var(--muted)}
.lab .svc{flex:1 1 220px;display:flex;align-items:center;padding:8px 14px;border-radius:6px;font-weight:600;font-size:14px}
.lab .svc.ok{background:color-mix(in srgb,var(--green) 18%,var(--surface));border:1px solid var(--green)}
.lab .svc.bad{background:color-mix(in srgb,var(--red) 22%,var(--surface));border:1px solid var(--red)}
.lab .ctl{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px}
.lab .ctl button{width:34px;height:34px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);font-weight:800}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.node{border:2px solid var(--ink);border-radius:6px;padding:10px;min-height:140px;background:color-mix(in srgb,var(--blue) 8%,var(--surface))}
.node.down{border-style:dashed;opacity:.55}
.nhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:700 14px var(--mono)}
.mini{padding:3px 10px;border:1.5px solid var(--ink);border-radius:4px;background:var(--surface);font-size:12px}
.podrow{display:flex;flex-wrap:wrap;gap:6px}
.pod{position:relative;min-width:68px;height:34px;padding:0 6px;border:0;border-bottom:5px solid rgba(0,0,0,.3);border-radius:3px;background:var(--green);color:#fff;font:600 11px var(--mono);overflow:hidden}
.pod::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 8px)}
.pod span{position:relative}
.pod.starting{background:var(--yellow);color:var(--on-yellow)}
.pod.dying{background:var(--red);opacity:.5;cursor:default}
@media (prefers-reduced-motion:no-preference){.pod.starting{animation:pulse 1s infinite}}
@keyframes pulse{50%{opacity:.55}}
.tasks{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.tasks li{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px}
.tasks li.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--surface))}
.log{list-style:none;margin:16px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:6px;font:12.5px/1.6 var(--mono);min-height:84px;color:var(--muted)}
.log li:first-child{color:var(--ink)}

/* finish */
.finish{padding:34px 0 50px}
.fbox{position:relative;background:var(--c);color:var(--on);padding:34px clamp(18px,4vw,36px) 36px;border-bottom:10px solid rgba(0,0,0,.3);border-radius:4px;overflow:hidden}
.fbox::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 3px,transparent 3px 11px);pointer-events:none}
.fbox>*{position:relative}
.fbox h2{font-size:clamp(34px,6vw,54px);font-weight:800;margin-bottom:10px}
.fbox p{max-width:36em;margin:6px 0}
.fbox .btn{background:var(--on);color:var(--c)}
.fbox .btn.alt{background:none;color:var(--on);border-color:var(--on)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="brand" aria-label="Dockside, back to the level map"><i aria-hidden="true"><b></b><b></b><b></b></i>Dockside</button>
  <div class="score" aria-live="polite"><span>XP <b id="xp">0</b></span><span>Streak <b id="streak">0</b></span></div>
</div></header>
<main class="wrap" id="app"></main>

<script>
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const state = { xp: 0, streak: 0, done: new Set(), run: null };
let simTimer = null;
const clearSim = () => { if (simTimer) { clearInterval(simTimer); simTimer = null; } };
function award(n) { state.xp += n; stats(); }
function stats() { $('#xp').textContent = state.xp; $('#streak').textContent = state.streak; }

/* ---------- content ---------- */
const V = {
  stack: `<div class="stackviz" role="img" aria-label="Three apps in containers sharing one Docker engine and one host operating system"><div class="apps"><span>App A</span><span>App B</span><span>App C</span></div><div class="eng">Docker Engine</div><div class="os">Host operating system</div></div>`,
  cluster: `<div class="clusterviz" role="img" aria-label="A cluster of three nodes, each running pods"><div class="cn">node<div class="pods"><i></i><i></i></div></div><div class="cn">node<div class="pods"><i></i><i></i><i></i></div></div><div class="cn">node<div class="pods"><i></i></div></div></div>`,
  journey: `<div class="journey"><span>Write code</span><span>Dockerfile</span><span>Build image</span><span>Push to registry</span><em>then</em><span class="k">Deployment YAML</span><span class="k">kubectl apply</span><span class="k">Pods running</span></div>`
};

const LEVELS = [
{ id: 1, track: 'Docker', color: 'blue', title: 'What is a container?', blurb: 'Why apps get packed in boxes.', steps: [
  { type: 'lesson', title: 'The "works on my machine" problem', visual: 'stack', body: `
    <p>Your app runs on your laptop. On the server it breaks: wrong Python version, a missing library.</p>
    <p>A <b>container</b> packs the app together with everything it needs, so it runs the same way everywhere.</p>
    <ul><li>Light: containers share the host's operating system kernel.</li><li>Fast: they start in seconds.</li><li>Same result on a laptop, a server, or the cloud.</li></ul>` },
  { type: 'quiz', q: "What problem do containers solve most directly?", options: ["The same app behaving differently on different machines", "Slow internet connections", "Having to write less code", "Losing data when a server restarts"], answer: 0, why: "A container carries the app and its dependencies, so the environment is the same everywhere it runs." },
  { type: 'quiz', q: "Compared with a virtual machine, a container is…", options: ["Lighter, because it shares the host's OS kernel", "Heavier, because it has its own full OS", "Exactly the same thing", "Only usable on one machine"], answer: 0, why: "A VM carries a whole guest operating system. A container only packs the app and its libraries." },
  { type: 'match', prompt: "Match each Docker word to its meaning.", pairs: [
    ["Image", "A read-only package: your app plus what it needs"],
    ["Container", "A running copy of an image"],
    ["Dockerfile", "The recipe that builds an image"],
    ["Registry", "A shelf that stores images, like Docker Hub"] ] }
]},
{ id: 2, track: 'Docker', color: 'blue', title: 'Write a Dockerfile', blurb: 'Build the recipe, line by line.', steps: [
  { type: 'lesson', title: 'A Dockerfile is a recipe', body: `
    <p>Each line is one instruction. The main ones:</p>
    <ul><li><code>FROM</code>: the base image to start from</li><li><code>WORKDIR</code>: the folder inside the container</li><li><code>COPY</code>: copy files in</li><li><code>RUN</code>: run a command while building</li><li><code>CMD</code>: the command that starts the app</li></ul>
    <p>Docker caches every line. Put things that change rarely (installing libraries) before things that change often (your code).</p>` },
  { type: 'order', prompt: "Put this Dockerfile for a Python app in the right order.", items: [
    'FROM python:3.11-slim', 'WORKDIR /app', 'COPY requirements.txt .', 'RUN pip install -r requirements.txt', 'COPY . .', 'CMD ["python", "app.py"]' ],
    why: "Base image first, then libraries, then your code. Libraries change rarely, so Docker reuses that cached step when only your code changes." },
  { type: 'quiz', q: "What does `FROM python:3.11-slim` do?", options: ["Sets the base image to build on", "Copies Python into your laptop", "Starts the app", "Deletes old images"], answer: 0, why: "Every image starts from a base. Here it is a small Python 3.11 image." },
  { type: 'quiz', q: "Why copy `requirements.txt` and install libraries before copying the rest of the code?", options: ["Docker can reuse the cached install step when only code changes", "Docker refuses any other order", "It makes the app run faster", "It makes the image private"], answer: 0, why: "Layers are cached top to bottom. If the code changes but the requirements don't, the slow install step is skipped." },
  { type: 'quiz', q: "What is the difference between `RUN` and `CMD`?", options: ["RUN happens while building the image. CMD is what runs when the container starts", "RUN starts the container. CMD builds the image", "They are the same", "CMD installs libraries. RUN copies files"], answer: 0, why: "RUN bakes results into the image. CMD is the default start command of the container." }
]},
{ id: 3, track: 'Docker', color: 'blue', title: 'Docker commands', blurb: 'Build, run, look, stop.', steps: [
  { type: 'lesson', title: 'A few commands cover most days', body: `
    <ul><li><code>docker build</code> turns a Dockerfile into an image.</li><li><code>docker run</code> starts a container from an image.</li><li><code>docker ps</code> lists running containers.</li><li><code>docker logs</code> shows what a container printed.</li><li><code>docker stop</code> stops a container.</li></ul>` },
  { type: 'match', mono: true, prompt: "Match each command to what it does.", pairs: [
    ["docker build -t myapp .", "Build an image named myapp"],
    ["docker run -p 8080:80 myapp", "Start a container from myapp"],
    ["docker ps", "List running containers"],
    ["docker logs <id>", "Show what a container printed"],
    ["docker stop <id>", "Stop a running container"] ] },
  { type: 'quiz', q: "In `docker run -p 8080:80 myapp`, which port is opened on your own computer?", options: ["8080", "80", "Both", "Neither"], answer: 0, why: "The format is host:container. Open localhost:8080 and Docker forwards the request to port 80 inside the container." },
  { type: 'quiz', q: "You ran `docker run myapp` three times. What do you have now?", options: ["One image and three containers", "Three images and one container", "One image and one container", "Three images and three containers"], answer: 0, why: "An image is reusable. Every run creates a new container from it." },
  { type: 'quiz', q: "A container exits right after it starts. Which command shows why?", options: ["`docker logs <id>`", "`docker build .`", "`docker push myapp`", "`docker pull myapp`"], answer: 0, why: "Logs show the output and errors, even for a container that already exited. Use `docker ps -a` to find its id." }
]},
{ id: 4, track: 'Kubernetes', color: 'green', title: 'Why Kubernetes?', blurb: 'Who manages 100 boxes?', steps: [
  { type: 'lesson', title: "Docker runs boxes. Who manages them?", visual: 'cluster', body: `
    <p>Docker is great for one container on one machine. Real systems have dozens of containers across many machines:</p>
    <ul><li>Which machine should run which container?</li><li>What if one crashes at 3 a.m.?</li><li>What if traffic suddenly triples?</li></ul>
    <p><b>Kubernetes</b> (K8s) answers these. You describe what you want, such as "run 3 copies of this app", and Kubernetes keeps it true. The name is Greek for helmsman.</p>` },
  { type: 'quiz', q: "You tell Kubernetes you want 3 copies of your app. One crashes. What happens?", options: ["Kubernetes starts a replacement to get back to 3", "The app stays at 2 until you restart it", "Kubernetes shuts down all copies", "Docker reboots the machine"], answer: 0, why: "Kubernetes compares what you asked for (desired state) with what exists (actual state) and fixes any gap." },
  { type: 'match', prompt: "Match each Kubernetes object to its job.", pairs: [
    ["Pod", "Smallest unit: wraps one or more containers"],
    ["Node", "A machine that runs pods"],
    ["Deployment", "Keeps the right number of identical pods running"],
    ["Service", "A stable address that sends traffic to pods"] ] },
  { type: 'quiz', q: "Pods already have IP addresses. Why do we need a Service?", options: ["Pod IPs change when pods are replaced, so a Service gives a stable address", "Pods have no network at all", "A Service builds the images", "A Service stores the data"], answer: 0, why: "Pods come and go. The Service keeps one steady address and sends traffic to whichever pods are healthy." }
]},
{ id: 5, track: 'Kubernetes', color: 'green', title: 'Self-healing lab', blurb: 'Break a live cluster on purpose.', steps: [
  { type: 'lesson', title: 'Desired state versus actual state', body: `
    <p>You write down what you want: <b>3 pods</b>. Kubernetes keeps comparing that wish with reality and fixes any gap. This loop is the heart of Kubernetes.</p>
    <p>Next you get a small cluster of your own. Break it and watch it heal.</p>` },
  { type: 'sim' },
  { type: 'quiz', q: "You deleted a pod and a new one appeared a moment later. What did that?", options: ["The Deployment saw fewer pods than wanted and started one", "Your browser refreshed", "Docker rebuilt the image", "The pod fixed itself"], answer: 0, why: "The Deployment's controller noticed 2 running versus 3 wanted and created a replacement." },
  { type: 'quiz', q: "A whole node crashes with 2 pods on it. What does Kubernetes do?", options: ["Starts replacement pods on the healthy nodes", "Nothing, those pods are gone for good", "Turns off the Service", "Waits for you to restart the node"], answer: 0, why: "The pods are missing, so the Deployment schedules new ones on nodes that are still up." }
]},
{ id: 6, track: 'Kubernetes', color: 'green', title: 'Read the YAML', blurb: 'Describe what you want.', steps: [
  { type: 'lesson', title: 'YAML says what you want', body: `
    <p>You give Kubernetes a YAML file. Here is a Deployment that keeps 3 copies of an app running:</p>
<pre><code>apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: myrepo/orders-api:1.0
          ports:
            - containerPort: 8080</code></pre>
    <p>Apply it with <code>kubectl apply -f deployment.yaml</code>.</p>` },
  { type: 'quiz', q: "Which line sets how many pods the Deployment keeps running?", code: "spec:\n  replicas: 3\n  template:\n    spec:\n      containers:\n        - image: myrepo/orders-api:1.0", options: ["`replicas: 3`", "`template:`", "`containers:`", "`image: myrepo/orders-api:1.0`"], answer: 0, why: "replicas is the desired number of identical pods." },
  { type: 'quiz', q: "Fill the blank. Which kind keeps 3 copies of a pod running?", code: "apiVersion: apps/v1\nkind: ______\nspec:\n  replicas: 3", options: ["Deployment", "Namespace", "ConfigMap", "Dockerfile"], answer: 0, why: "A Deployment manages a set of identical pods. A Dockerfile is a Docker thing, not a Kubernetes kind." },
  { type: 'quiz', q: "Where does this image come from?", code: "image: myrepo/orders-api:1.0", options: ["You built it with Docker and pushed it to a registry", "Kubernetes builds it from your source code", "It is created when you run kubectl apply", "It is part of every Node"], answer: 0, why: "Kubernetes only pulls images. Docker builds them, and a registry stores them." },
  { type: 'quiz', q: "You change `replicas: 3` to `replicas: 5` and run `kubectl apply -f deployment.yaml`. What happens?", options: ["Kubernetes starts 2 more pods to reach 5", "Nothing, you must delete the Deployment first", "All pods are deleted for good", "The image is rebuilt"], answer: 0, why: "Apply updates the desired state. Kubernetes closes the gap between 3 and 5." },
  { type: 'quiz', q: "Which command lists your pods?", options: ["`kubectl get pods`", "`docker ps`", "`kubectl list`", "`kubectl show pods`"], answer: 0, why: "`docker ps` lists local Docker containers. `kubectl get pods` asks the cluster." }
]},
{ id: 7, track: 'Together', color: 'yellow', title: 'From code to cluster', blurb: 'The full journey, start to finish.', steps: [
  { type: 'lesson', title: 'Docker first, then Kubernetes', visual: 'journey', body: `
    <p>The Docker half builds the box and shares it. The Kubernetes half describes how to run it.</p>
    <p>This is why the two are always learned together: Kubernetes needs the images that Docker builds.</p>` },
  { type: 'order', prompt: "Put the journey in order, from code to running pods.", items: [
    'Write the app code', 'Write a Dockerfile', 'docker build the image', 'docker push the image to a registry', 'Write the Deployment YAML', 'kubectl apply -f deployment.yaml' ],
    why: "Docker steps come first: build the image and share it. Then Kubernetes steps: describe it and run it." },
  { type: 'quiz', q: "Your pod is stuck in `ImagePullBackOff`. What is the most likely cause?", options: ["The image name or tag is wrong, or it was never pushed to a registry", "The Service is missing", "The node has too many pods", "The YAML has too many spaces"], answer: 0, why: "Cluster nodes pull images from a registry. An image that only exists on your laptop is invisible to them." },
  { type: 'quiz', q: "Which statement is true?", options: ["Docker builds and runs containers. Kubernetes manages many containers across machines", "Kubernetes builds images. Docker schedules pods", "They do the same job", "Kubernetes replaces the need for images"], answer: 0, why: "Docker packages. Kubernetes orchestrates." },
  { type: 'quiz', q: "A pod keeps restarting (`CrashLoopBackOff`). What do you check first?", options: ["`kubectl logs <pod>`", "`docker build .`", "`kubectl get nodes`", "Nothing, wait a day"], answer: 0, why: "The logs usually show the error that makes the app exit. It is the same idea as `docker logs`." }
]},
{ id: 8, track: 'Together', color: 'red', title: 'Boss battle', blurb: '8 random questions. Misses come back.', boss: true, steps: [] }
];

/* ---------- home ---------- */
function card(l) {
  const done = state.done.has(l.id);
  const n = l.boss ? 8 : l.steps.length;
  return `<button class="box c-${l.color}" data-id="${l.id}" aria-label="Level ${l.id}: ${esc(l.title)}${done ? ', done' : ''}">
    <span class="lv">Level ${l.id}</span><span class="nm">${esc(l.title)}</span><span class="bl">${esc(l.blurb)}</span>
    ${done ? '<span class="stamp">Done</span>' : ''}</button>`;
}
function home() {
  clearSim(); state.run = null; stats();
  const t = (name, sub, ids) => `<section class="track"><h2>${name}</h2><p>${sub}</p><div class="grid">${ids.map(i => card(LEVELS[i - 1])).join('')}</div></section>`;
  app.innerHTML = `
  <section class="hero">
    <h1>Pack it. Ship it. Keep it running.</h1>
    <p class="lede">Learn Docker and Kubernetes in small bites: quizzes, puzzles, and a live cluster you can break on purpose.</p>
    <div class="flow"><div><b>Docker</b><span>packs your app into a container</span></div><div class="then">then</div><div><b>Kubernetes</b><span>runs many containers and replaces any that break</span></div></div>
    <div class="loaded"><div class="slots8" aria-hidden="true">${LEVELS.map(l => `<i class="${state.done.has(l.id) ? 'on' : ''}"></i>`).join('')}</div>${state.done.size} of ${LEVELS.length} levels done</div>
  </section>
  ${t('Docker', 'Build and run your first containers.', [1, 2, 3])}
  ${t('Kubernetes', 'Run containers at scale and watch them heal.', [4, 5, 6])}
  ${t('Together', 'Connect the two, then test everything.', [7, 8])}
  <div class="cheat">
    <section><h3>Docker cheat sheet</h3><dl>
      <dt><code>docker build -t app .</code></dt><dd>build an image</dd>
      <dt><code>docker run -p 8080:80 app</code></dt><dd>start a container</dd>
      <dt><code>docker ps</code></dt><dd>running containers</dd>
      <dt><code>docker logs &lt;id&gt;</code></dt><dd>see output</dd>
      <dt><code>docker stop &lt;id&gt;</code></dt><dd>stop it</dd>
      <dt><code>docker push app</code></dt><dd>send to a registry</dd></dl></section>
    <section><h3>kubectl cheat sheet</h3><dl>
      <dt><code>kubectl apply -f file.yaml</code></dt><dd>create or update</dd>
      <dt><code>kubectl get pods</code></dt><dd>list pods</dd>
      <dt><code>kubectl describe pod &lt;p&gt;</code></dt><dd>details and events</dd>
      <dt><code>kubectl logs &lt;p&gt;</code></dt><dd>pod output</dd>
      <dt><code>kubectl scale deploy/x --replicas=5</code></dt><dd>change copies</dd>
      <dt><code>kubectl delete pod &lt;p&gt;</code></dt><dd>remove a pod</dd></dl></section>
  </div>
  <p class="foot">Progress resets when you close this page. Replay any level to practice again.</p>`;
  app.querySelectorAll('.box').forEach(b => b.onclick = () => startLevel(+b.dataset.id));
}

/* ---------- runner ---------- */
function bossSteps() {
  const pool = LEVELS.filter(l => !l.boss).flatMap(l => l.steps.filter(s => s.type === 'quiz'));
  return shuffle(pool).slice(0, 8).map(s => ({ ...s, again: false }));
}
function startLevel(id) {
  const L = LEVELS.find(l => l.id === id);
  const queue = L.boss ? bossSteps() : L.steps.map(s => ({ ...s }));
  state.run = { L, queue, i: 0, firstTry: 0, quizzes: 0 };
  step();
}
function step() {
  clearSim();
  const r = state.run;
  if (r.i >= r.queue.length) return finish();
  const s = r.queue[r.i], L = r.L, n = r.queue.length;
  app.innerHTML = `
  <div class="runbar c-${L.color}"><button class="link" id="back">Back to map</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${r.i}"><i style="width:${(r.i / n) * 100}%"></i></div>
    <span class="count">${r.i + 1} of ${n}</span></div>
  <article class="stage c-${L.color}"><div class="who">Level ${L.id} · ${esc(L.title)}</div><div id="stage"></div></article>`;
  $('#back').onclick = home;
  RENDER[s.type](s, $('#stage'));
  window.scrollTo({ top: 0 });
}
function next() { state.run.i++; step(); }
function cont(el, label) {
  const b = document.createElement('button');
  b.className = 'btn'; b.id = 'next'; b.textContent = label || 'Continue'; b.onclick = next;
  el.appendChild(b); b.focus();
  return b;
}

const RENDER = {
  lesson(s, el) {
    el.innerHTML = `<h2>${esc(s.title)}</h2><div class="lesson">${s.body}${s.visual ? V[s.visual] : ''}</div>`;
    cont(el, 'Got it');
  },

  quiz(s, el) {
    const r = state.run;
    const opts = shuffle(s.options.map((t, i) => ({ t, ok: i === s.answer })));
    let locked = false;
    el.innerHTML = `${s.again ? '<span class="again">Let\'s try this one again</span>' : ''}
      <h2 class="q">${fmt(s.q)}</h2>${s.code ? `<pre><code>${esc(s.code)}</code></pre>` : ''}
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${fmt(o.t)}</button>`).join('')}</div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    const btns = [...el.querySelectorAll('.opt')];
    btns.forEach(b => b.onclick = () => {
      if (locked) return; locked = true;
      const o = opts[+b.dataset.i];
      if (!s.again) r.quizzes++;
      btns.forEach((x, i) => { x.disabled = true; if (opts[i].ok) x.classList.add('right'); });
      if (o.ok) {
        if (!s.again) r.firstTry++;
        state.streak++; award(s.again ? 5 : 10);
      } else {
        b.classList.add('wrong'); state.streak = 0; stats();
        r.queue.push({ ...s, again: true });
      }
      $('#fb', el).innerHTML = `<strong>${o.ok ? 'Correct.' : 'Not quite. This one will come back.'}</strong><p>${fmt(s.why)}</p>`;
      cont($('#fb', el));
    });
  },

  order(s, el) {
    const sol = s.items;
    let pool = shuffle(sol.map((_, i) => i)), picked = [], status = [], tries = 0, finished = false, msg = '';
    const draw = () => {
      el.innerHTML = `<h2 class="q">${fmt(s.prompt)}</h2>
        <p class="hint">Tap the lines in order. Tap a placed line to take it back.</p>
        <div class="slots">${sol.map((_, k) => picked[k] === undefined
          ? `<div class="slot"><span class="n">${k + 1}</span></div>`
          : `<button class="slot filled ${status[k] || ''}" data-k="${k}" ${finished ? 'disabled' : ''}><span class="n">${k + 1}</span><code>${esc(sol[picked[k]])}</code></button>`).join('')}</div>
        <div class="pool">${pool.map(id => `<button class="chip" data-id="${id}"><code>${esc(sol[id])}</code></button>`).join('')}</div>
        <div class="row"><button class="btn" id="check" ${picked.length < sol.length || finished ? 'disabled' : ''}>Check order</button>
        ${finished ? '' : '<button class="link" id="reset">Start over</button>'}</div>
        <div class="fb" id="fb" aria-live="polite">${msg}</div>`;
      el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const id = picked.splice(+b.dataset.k, 1)[0]; pool.push(id); status = []; msg = ''; draw(); });
      el.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { const id = +b.dataset.id; pool = pool.filter(x => x !== id); picked.push(id); status = []; msg = ''; draw(); });
      const rs = $('#reset', el); if (rs) rs.onclick = () => { pool = shuffle(sol.map((_, i) => i)); picked = []; status = []; msg = ''; draw(); };
      $('#check', el).onclick = () => {
        tries++;
        status = picked.map((id, k) => id === k ? 'right' : 'wrong');
        const good = status.filter(x => x === 'right').length;
        if (good === sol.length) {
          finished = true; award(tries === 1 ? 15 : 8);
          msg = `<strong>Correct.</strong><p>${fmt(s.why)}</p>`; draw(); cont($('#fb', el));
        } else {
          const w = status.indexOf('wrong');
          msg = `<strong>${good} of ${sol.length} lines are in the right place.</strong><p>Fix the red ones.${tries >= 2 ? ` Hint: line ${w + 1} is <code>${esc(sol[w])}</code>.` : ''}</p>`;
          draw();
        }
      };
    };
    draw();
  },

  match(s, el) {
    const n = s.pairs.length;
    const left = s.pairs.map((p, i) => ({ id: i, t: p[0] }));
    const right = shuffle(s.pairs.map((p, i) => ({ id: i, t: p[1] })));
    let sel = null, done = new Set(), miss = 0, bad = null;
    const draw = () => {
      el.innerHTML = `<h2 class="q">${fmt(s.prompt)}</h2><p class="hint">Tap one on the left, then its match on the right.</p>
        <div class="match">
          <div class="col">${left.map(x => `<button class="mt ${done.has(x.id) ? 'right' : ''} ${sel === x.id ? 'sel' : ''}" data-l="${x.id}" aria-pressed="${sel === x.id}" ${done.has(x.id) ? 'disabled' : ''}>${s.mono ? `<code>${esc(x.t)}</code>` : esc(x.t)}</button>`).join('')}</div>
          <div class="col">${right.map(x => `<button class="mt ${done.has(x.id) ? 'right' : ''} ${bad === x.id ? 'wrong' : ''}" data-r="${x.id}" ${done.has(x.id) ? 'disabled' : ''}>${esc(x.t)}</button>`).join('')}</div>
        </div><div class="fb" id="fb" aria-live="polite"></div>`;
      el.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { sel = +b.dataset.l; draw(); });
      el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
        if (sel === null) return;
        const id = +b.dataset.r;
        if (id === sel) {
          done.add(id); sel = null; draw();
          if (done.size === n) { award(miss === 0 ? 15 : 8); $('#fb', el).innerHTML = `<strong>All matched.</strong><p>${miss === 0 ? 'No misses.' : miss + ' miss' + (miss > 1 ? 'es' : '') + '. Replay this level to get a clean run.'}</p>`; cont($('#fb', el)); }
        } else {
          miss++; bad = id; sel = null; draw();
          setTimeout(() => { bad = null; if (done.size < n) draw(); }, 600);
        }
      });
    };
    draw();
  },

  sim(s, el) {
    const nodes = [{ n: 'node-a', up: true }, { n: 'node-b', up: true }, { n: 'node-c', up: true }];
    const rid = () => Math.random().toString(36).slice(2, 7);
    let desired = 3, log = ['Deployment orders-api wants 3 pods. 3 are running.'], tick = 0, contShown = false;
    let pods = nodes.map(n => ({ id: rid(), node: n.n, state: 'running', born: 0 }));
    const tasks = { kill: false, scale: false, node: false };
    const say = t => { log.unshift(t); log = log.slice(0, 6); };

    el.innerHTML = `<div class="lab"><h2>Your cluster</h2>
      <p class="hint">This Deployment wants a set number of pods. Try all three actions below.</p>
      <div class="ctl"><span>Copies wanted:</span><button id="minus" aria-label="Fewer copies">−</button><b id="want" style="min-width:1.5em;text-align:center">3</b><button id="plus" aria-label="More copies">+</button></div>
      <div id="body"></div><div id="simcont"></div></div>`;

    function draw() {
      const running = pods.filter(p => p.state === 'running').length;
      $('#want', el).textContent = desired;
      $('#body', el).innerHTML = `
        <div class="statrow">
          <div class="num"><b>${desired}</b><span>wanted</span></div>
          <div class="num"><b>${running}</b><span>running</span></div>
          <div class="svc ${running ? 'ok' : 'bad'}">${running ? `Service sends traffic to ${running} pod${running > 1 ? 's' : ''}` : 'Outage: no pod is ready'}</div>
        </div>
        <div class="nodes">${nodes.map(n => `<div class="node ${n.up ? '' : 'down'}">
          <div class="nhead"><span>${n.n}</span><button class="mini" data-node="${n.n}">${n.up ? 'Crash node' : 'Restore'}</button></div>
          <div class="podrow">${pods.filter(p => p.node === n.n).map(p => `<button class="pod ${p.state}" data-pod="${p.id}" ${p.state === 'dying' ? 'disabled' : ''} aria-label="Pod ${p.id}, ${p.state}. Select to delete it."><span>${p.id}</span></button>`).join('')}</div></div>`).join('')}</div>
        <ul class="tasks"><li class="${tasks.kill ? 'ok' : ''}">${tasks.kill ? '✓ ' : ''}Delete a pod (tap it)</li><li class="${tasks.scale ? 'ok' : ''}">${tasks.scale ? '✓ ' : ''}Change the copies wanted</li><li class="${tasks.node ? 'ok' : ''}">${tasks.node ? '✓ ' : ''}Crash a node</li></ul>
        <ul class="log" aria-label="Cluster events">${log.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
      if (!contShown && tasks.kill && tasks.scale && tasks.node) { contShown = true; cont($('#simcont', el), 'I saw it heal'); }
    }

    function reconcile() {
      tick++;
      const now = Date.now();
      pods.forEach(p => { if (p.state === 'starting' && now - p.born > 1500) { p.state = 'running'; say(`${p.id} is running on ${p.node}`); } });
      pods = pods.filter(p => !(p.state === 'dying' && now - p.diedAt > 1000));
      const alive = pods.filter(p => p.state !== 'dying');
      if (alive.length < desired) {
        const up = nodes.filter(n => n.up);
        if (up.length) {
          const target = up.map(n => ({ n: n.n, c: alive.filter(p => p.node === n.n).length })).sort((a, b) => a.c - b.c)[0].n;
          const p = { id: rid(), node: target, state: 'starting', born: now };
          pods.push(p); say(`${alive.length} of ${desired} pods exist. Starting ${p.id} on ${target}`);
        } else if (tick % 4 === 0) say('No healthy node to place a pod on');
      } else if (alive.length > desired) {
        const v = alive[alive.length - 1]; v.state = 'dying'; v.diedAt = now; say(`Too many pods. Stopping ${v.id}`);
      }
      draw();
    }

    el.addEventListener('click', e => {
      const pb = e.target.closest('[data-pod]');
      if (pb) { const p = pods.find(x => x.id === pb.dataset.pod); if (p && p.state !== 'dying') { p.state = 'dying'; p.diedAt = Date.now(); tasks.kill = true; say(`You deleted ${p.id}`); draw(); } return; }
      const nb = e.target.closest('[data-node]');
      if (nb) {
        const n = nodes.find(x => x.n === nb.dataset.node);
        if (n.up) { n.up = false; pods.filter(p => p.node === n.n && p.state !== 'dying').forEach(p => { p.state = 'dying'; p.diedAt = Date.now(); }); tasks.node = true; say(`${n.n} went down`); }
        else { n.up = true; say(`${n.n} is back`); }
        draw(); return;
      }
      if (e.target.id === 'plus' && desired < 6) { desired++; tasks.scale = true; say(`You changed copies wanted to ${desired}`); draw(); }
      if (e.target.id === 'minus' && desired > 1) { desired--; tasks.scale = true; say(`You changed copies wanted to ${desired}`); draw(); }
    });
    draw();
    simTimer = setInterval(reconcile, 800);
  }
};

/* ---------- finish ---------- */
function finish() {
  clearSim();
  const r = state.run, L = r.L;
  const first = !state.done.has(L.id);
  state.done.add(L.id);
  if (first) award(20);
  const nextL = LEVELS.find(l => l.id === L.id + 1);
  const perfect = r.firstTry === r.quizzes;
  app.innerHTML = `<section class="finish"><div class="fbox c-${L.color}">
    <h2>${esc(L.title)}: done</h2>
    <p>Quiz answers right on the first try: <b>${r.firstTry} of ${r.quizzes}</b>.</p>
    ${first ? '<p>+20 XP for finishing this level.</p>' : ''}
    ${perfect ? '' : '<p>Replay this level to turn the misses into first-try wins. Repeating is how it sticks.</p>'}
    ${state.done.size === LEVELS.length ? '<p>All 8 levels are done. Replay any of them to sharpen recall.</p>' : ''}
    <div class="row">${nextL ? '<button class="btn" id="nx">Next level</button>' : ''}<button class="btn ${nextL ? 'alt' : ''}" id="rp">Replay</button><button class="btn alt" id="mp">Back to map</button></div>
  </div></section>`;
  if (nextL) $('#nx').onclick = () => startLevel(nextL.id);
  $('#rp').onclick = () => startLevel(L.id);
  $('#mp').onclick = home;
}

$('#brand').onclick = home;
home();
</script>
</body>
</html>
