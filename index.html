        <div class="sugg" id="sugg"></div></div>
    </div>`;
    const term = $('#term', el), input = $('#ti', el);
    const line = (t, c) => { const d = document.createElement('div'); if (c) d.className = c; d.textContent = t; term.appendChild(d); term.scrollTop = term.scrollHeight; };
    const chips = list => `<div class="chips">${list.map(c => `<button type="button" class="chipb" data-fill="${esc(c[0])}" title="${esc(c[1] || '')}">${esc(c[0])}</button>`).join('')}</div>`;
    const coach = (cls, title, text, extra) => { $('#coach', el).innerHTML = text ? `<div class="coach ${cls}"><b>${esc(title)}</b>${esc(text)}${extra || ''}</div>` : ''; };
    const explainNow = () => { const rows = explainCmd(input.value); $('#xpl', el).innerHTML = rows.length > 1 ? `<div class="xh">What this command means</div>${rows.map(r => `<div class="xrow"><code>${esc(r[0])}</code><span>${esc(r[1])}</span></div>`).join('')}` : ''; };
    const fill = v => { input.value = v; explainNow(); input.focus(); };
    const showSugg = () => {
      const g = $('#sugg', el);
      if (guided) { g.innerHTML = ''; return; }
      const list = suggestNext(E);
      g.innerHTML = list.length ? `<h3>Things to try next</h3>${list.map(c => `<button type="button" data-fill="${esc(c[0])}"><code>${esc(c[0])}</code><span>${esc(c[1])}</span></button>`).join('')}` : '';
    };
    const pick = key => { const p = pickCmds(E, key); if (p) coach('info', p.title, 'Tap one to put it in the terminal, then press Run.', chips(p.cmds)); };
    const world = makeWorld($('#world', el), () => E, v => submit(v), pick);
    function nextMission() { m++; solved = false; reveal = 0; usedAnswer = false; coach('', '', ''); guide(); input.focus(); }
    function guide() {
      const g = $('#guide', el);
      if (cfg.tryText) {
        g.innerHTML = `<div class="mn">Try it yourself</div><p class="goal">${fmt(cfg.tryText)}</p><p class="say">The command is already in the terminal. Press Run, then change it and see what happens.</p>`;
        return;
      }
      if (cfg.free) {
        g.innerHTML = `<p class="goal">Free play</p><p class="say">Nothing here can break. Tap a suggestion under the terminal, or type your own command. The picture shows what Docker is doing.</p>`;
        return;
      }
      const M = cfg.missions[m];
      if (entered !== m) {
        entered = m; if (M.enter) M.enter(E, S);
        toks = M.bank ? shuffle([...new Set(answersOf(M, E, S).join(' ').split(' ').filter(Boolean).concat(M.x || []))]) : [];
      }
      const ans = answersOf(M, E, S), showCmd = reveal >= 2 || (reveal >= 1 && !M.hint);
      if (showCmd) usedAnswer = true;
      let h = `<div class="mn">Mission ${m + 1} of ${N}</div><div class="mdots" aria-hidden="true">${cfg.missions.map((_, i) => `<i class="${i < m || (i === m && solved) ? 'on' : ''}"></i>`).join('')}</div>${M.say ? `<p class="say">${fmt(M.say)}</p>` : ''}<p class="goal">${fmt(M.goal)}</p>`;
      if (solved) h += `<p class="done">Done.</p>${M.after ? `<p class="after">${fmt(M.after)}</p>` : ''}<div id="gn"></div>`;
      else {
        if (toks.length) h += `<p class="hint" style="margin:6px 0 0">Tap the parts in the right order, or type the command yourself.</p><div class="bank">${toks.map(t => `<button type="button" data-tok="${esc(t)}">${esc(t)}</button>`).join('')}<button type="button" class="link" id="clr">Clear</button></div>`;
        if (reveal >= 1 && M.hint) h += `<p class="hint" style="margin:8px 0 0">${fmt(M.hint)}</p>`;
        if (showCmd) h += `<pre><code>${esc(ans.join('\n'))}</code></pre>${ans.length ? `<button type="button" class="link" data-fill="${esc(ans[0])}">Put ${ans.length > 1 ? 'the first command' : 'it'} in the terminal</button>` : ''}`;
        else h += `<button class="link" id="hintb" type="button">${reveal === 0 && M.hint ? 'Stuck? Get a hint' : 'Show me the command'}</button>`;
      }
      g.innerHTML = h;
      g.querySelectorAll('[data-tok]').forEach(b => { b.onclick = () => { fill((input.value ? input.value.replace(/\s*$/, ' ') : '') + b.dataset.tok); }; });
      const clr = $('#clr', g); if (clr) clr.onclick = () => fill('');
      const hb = $('#hintb', g); if (hb) hb.onclick = () => { reveal++; guide(); };
      if (solved) {
        if (m < N - 1) { const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.textContent = 'Next mission'; b.onclick = nextMission; $('#gn', g).appendChild(b); b.focus(); }
        else cont($('#gn', g), 'Continue');
      }
    }
    function submit(v) {
      v = String(v).trim();
      if (!v) { if (solved && m < N - 1) nextMission(); return; }
      hist.push(v); hi = hist.length;
      line('$ ' + v, 'cmd');
      if (v === 'clear') { term.innerHTML = ''; explainNow(); return; }
      const M = cfg.free || solved ? null : cfg.missions[m];
      const r = labStep(E, S, M, v);
      r.res.out.forEach(o => line(o.t, o.c));
      world.render(r.res.fx);
      if (cfg.feed && cfg.feed.length) input.value = cfg.feed.shift();
      explainNow();
      if (r.solved) {
        solved = true; award(usedAnswer ? 5 : 10); coach('', '', ''); guide();
        const g = $('#guide', el); if (g.scrollIntoView && window.innerWidth <= 900) g.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
      } else {
        const c = coachFor(v.replace(/\s+/g, ' '), r.res, E);
        if (c) coach(c.ok ? '' : 'bad', c.ok ? 'What happened' : 'What went wrong', c.text, c.fix && (!guided || !c.ok) ? `<div class="chips"><span class="chl">${c.ok ? 'Try next:' : 'This may help:'}</span><button type="button" class="chipb" data-fill="${esc(c.fix)}">${esc(c.fix)}</button></div>` : '');
        else coach('', '', '');
      }
      showSugg();
    }
    el.addEventListener('click', e => { const b = e.target.closest ? e.target.closest('[data-fill]') : null; if (b) fill(b.dataset.fill); });
    $('#tf', el).onsubmit = e => { e.preventDefault(); const v = input.value; input.value = ''; submit(v); };
    input.oninput = explainNow;
    input.onkeydown = e => {
      if (e.key === 'ArrowUp' && hist.length) { e.preventDefault(); hi = Math.max(0, hi - 1); fill(hist[hi]); }
      else if (e.key === 'ArrowDown' && hist.length) { e.preventDefault(); hi = Math.min(hist.length, hi + 1); fill(hist[hi] || ''); }
    };
    const rst = $('#rst', el);
    if (rst) rst.onclick = () => { clearSim(); boot(); term.innerHTML = ''; world.reset(); world.render(); line('A clean playground. Type a command and press Enter.', 'dim'); coach('info', 'Fresh start', 'Everything is back to how it was at the beginning.'); showSugg(); fill(''); };
    line('Docker playground. Type a command and press Enter.', 'dim');
    world.render(); guide(); showSugg();
    if (cfg.feed && cfg.feed.length) { input.value = cfg.feed.shift(); explainNow(); }
    else if (cfg.free && !cfg.tryText) coach('info', 'New here?', 'Tap a suggestion below. It puts the command in the terminal for you. Then press Run.');
  },

  demo(s, el) { DEMOS[s.name](s, el); },

  sim(s, el) {
    const nodes = [{ n: 'node-a', up: true }, { n: 'node-b', up: true }, { n: 'node-c', up: true }];
    const rid = () => Math.random().toString(36).slice(2, 7);
    let desired = 3, log = ['Deployment orders-api wants 3 pods. 3 are running.'], tick = 0, contShown = false;
    let pods = nodes.map(n => ({ id: rid(), node: n.n, state: 'running', born: 0 }));
    const tasks = { kill: false, scale: false, node: false };
    const say = t => { log.unshift(t); log = log.slice(0, 6); };

    el.innerHTML = `<div class="lab"><h2>Your cluster</h2>
      <p class="hint">This Deployment wants a set number of pods. Try all three actions below.</p>
      <div class="ctl"><span>Copies wanted:</span><button id="minus" aria-label="Fewer copies">−</button><b id="want" style="min-width:1.5em;text-align:center">3</b><button id="plus" aria-label="More copies">+</button></div>
      <div id="body"></div><div id="simcont"></div></div>`;

    function draw() {
      const running = pods.filter(p => p.state === 'running').length;
      $('#want', el).textContent = desired;
      $('#body', el).innerHTML = `
        <div class="statrow">
          <div class="num"><b>${desired}</b><span>wanted</span></div>
          <div class="num"><b>${running}</b><span>running</span></div>
          <div class="svc ${running ? 'ok' : 'bad'}">${running ? `Service sends traffic to ${running} pod${running > 1 ? 's' : ''}` : 'Outage: no pod is ready'}</div>
        </div>
        <div class="nodes">${nodes.map(n => `<div class="node ${n.up ? '' : 'down'}">
          <div class="nhead"><span>${n.n}</span><button class="mini" data-node="${n.n}">${n.up ? 'Crash node' : 'Restore'}</button></div>
          <div class="podrow">${pods.filter(p => p.node === n.n).map(p => `<button class="pod ${p.state}" data-pod="${p.id}" ${p.state === 'dying' ? 'disabled' : ''} aria-label="Pod ${p.id}, ${p.state}. Select to delete it."><span>${p.id}</span></button>`).join('')}</div></div>`).join('')}</div>
        <ul class="tasks"><li class="${tasks.kill ? 'ok' : ''}">${tasks.kill ? '✓ ' : ''}Delete a pod (tap it)</li><li class="${tasks.scale ? 'ok' : ''}">${tasks.scale ? '✓ ' : ''}Change the copies wanted</li><li class="${tasks.node ? 'ok' : ''}">${tasks.node ? '✓ ' : ''}Crash a node</li></ul>
        <ul class="log" aria-label="Cluster events">${log.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
      if (!contShown && tasks.kill && tasks.scale && tasks.node) { contShown = true; cont($('#simcont', el), 'I saw it heal'); }
    }

    function reconcile() {
      tick++;
      const now = Date.now();
      pods.forEach(p => { if (p.state === 'starting' && now - p.born > 1500) { p.state = 'running'; say(`${p.id} is running on ${p.node}`); } });
      pods = pods.filter(p => !(p.state === 'dying' && now - p.diedAt > 1000));
      const alive = pods.filter(p => p.state !== 'dying');
      if (alive.length < desired) {
        const up = nodes.filter(n => n.up);
        if (up.length) {
          const target = up.map(n => ({ n: n.n, c: alive.filter(p => p.node === n.n).length })).sort((a, b) => a.c - b.c)[0].n;
          const p = { id: rid(), node: target, state: 'starting', born: now };
          pods.push(p); say(`${alive.length} of ${desired} pods exist. Starting ${p.id} on ${target}`);
        } else if (tick % 4 === 0) say('No healthy node to place a pod on');
      } else if (alive.length > desired) {
        const v = alive[alive.length - 1]; v.state = 'dying'; v.diedAt = now; say(`Too many pods. Stopping ${v.id}`);
      }
      draw();
    }

    el.addEventListener('click', e => {
      const pb = e.target.closest('[data-pod]');
      if (pb) { const p = pods.find(x => x.id === pb.dataset.pod); if (p && p.state !== 'dying') { p.state = 'dying'; p.diedAt = Date.now(); tasks.kill = true; say(`You deleted ${p.id}`); draw(); } return; }
      const nb = e.target.closest('[data-node]');
      if (nb) {
        const n = nodes.find(x => x.n === nb.dataset.node);
        if (n.up) { n.up = false; pods.filter(p => p.node === n.n && p.state !== 'dying').forEach(p => { p.state = 'dying'; p.diedAt = Date.now(); }); tasks.node = true; say(`${n.n} went down`); }
        else { n.up = true; say(`${n.n} is back`); }
        draw(); return;
      }
      if (e.target.id === 'plus' && desired < 6) { desired++; tasks.scale = true; say(`You changed copies wanted to ${desired}`); draw(); }
      if (e.target.id === 'minus' && desired > 1) { desired--; tasks.scale = true; say(`You changed copies wanted to ${desired}`); draw(); }
    });
    draw();
    simTimer = setInterval(reconcile, 800);
  }
};

      busy = true; say('Stopping web'); draw();
      later(() => { st.web = 'stopped'; say('Stopping db'); draw(); }, 600);
      later(() => { st.db = 'stopped'; busy = false; up = false; tasks.down = true; say('Containers and network removed. Volume dbdata is kept'); draw(); }, 1200);
    };
    draw();
  },

  size(s, el) {
    const BASE = { full: 1000, slim: 130, alpine: 55 };
    let base = 'full', multi = false, ign = false;
    el.innerHTML = `<h2>Shrink the image</h2>
      <p class="hint">An example Python app. Pick the habits and watch the size.</p>
      <div class="row"><span>Base image:</span><div class="seg" role="group" aria-label="Base image"><button data-b="full" aria-pressed="true">python</button><button data-b="slim" aria-pressed="false">slim</button><button data-b="alpine" aria-pressed="false">alpine</button></div></div>
      <div style="margin-top:10px"><label class="chk"><input type="checkbox" id="ms"> Multi-stage build</label><label class="chk"><input type="checkbox" id="ig"> Use .dockerignore</label></div>
      <div class="bars" id="bars"></div><p class="cap">Illustrative numbers: base image size, plus 90 MB of libraries, plus 250 MB of build tools (removed by multi-stage), plus 120 MB of junk such as .git and data files (removed by .dockerignore). Your real numbers will differ.</p><div id="dc"></div>`;
    let contShown = false;
    function draw() {
      const parts = [['Base image', BASE[base]], ['Libraries', 90], ['Build tools', multi ? 0 : 250], ['Junk files', ign ? 0 : 120]];
      const total = parts.reduce((t, p) => t + p[1], 0), max = 1460;
      $('#bars', el).innerHTML = parts.map(p => `<div class="bar"><span>${p[0]}</span><i style="width:${(p[1] / max) * 100}%"></i><span>${p[1]} MB</span></div>`).join('') + `<div class="bar g"><span><b>Total</b></span><i style="width:${(total / max) * 100}%"></i><span><b>${total} MB</b></span></div>`;
      el.querySelectorAll('[data-b]').forEach(b => b.setAttribute('aria-pressed', b.dataset.b === base));
      if (!contShown && total < 300) { contShown = true; cont($('#dc', el), 'Much smaller'); }
    }
    el.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { base = b.dataset.b; draw(); });
    $('#ms', el).onchange = e => { multi = e.target.checked; draw(); };
    $('#ig', el).onchange = e => { ign = e.target.checked; draw(); };
    draw();
  }
};

/* ---------- finish ---------- */
function finish() {
  clearSim();
  const r = state.run, L = r.L;
  app.classList.remove('wide');
  if (!L.id) return home();
  const first = !state.done.has(L.id);
  state.done.add(L.id);
  if (first) award(20); else save();
  track('topic-done-' + L.id, L.title, true);
  const nextL = byId(L.id + 1);
  const perfect = r.firstTry === r.quizzes;
  app.innerHTML = `<section class="finish"><div class="fbox c-${L.color}">
    <h2>${esc(L.title)}: done</h2>
    <p>Quiz answers right on the first try: <b>${r.firstTry} of ${r.quizzes}</b>.</p>
    ${first ? '<p>+20 XP for finishing this level.</p>' : ''}
    ${perfect ? '' : '<p>Replay this level to turn the misses into first-try wins. Repeating is how it sticks.</p>'}
    ${state.done.size === LEVELS.length ? '<p>Every level is done. Replay any of them to sharpen recall.</p>' : ''}
    <div class="row">${nextL ? '<button class="btn" id="nx">Next level</button>' : ''}<button class="btn ${nextL ? 'alt' : ''}" id="rp">Replay</button><button class="btn alt" id="mp">Back to home</button>${L.track === 'Docker' && LEVELS.filter(l => l.track === 'Docker').every(l => state.done.has(l.id)) ? '<button class="btn alt" id="ce">Get your certificate</button>' : ''}</div>
  </div></section>`;
  if (nextL) $('#nx').onclick = () => startLevel(nextL.id);
  $('#rp').onclick = () => (L.boss ? startLevel(L.id) : startExercises(L.id));
  $('#mp').onclick = home;
  const ce = $('#ce'); if (ce) ce.onclick = certificate;
}

$('#brand').onclick = home;
load(); stats(); initStats(); route();
if (window.addEventListener) window.addEventListener('hashchange', () => { let hh = ''; try { hh = (location.hash || '').slice(1); } catch (e) {} if (hh !== curHash) route(); });
</script>
</body>
