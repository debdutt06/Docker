<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dockside: learn Docker from zero to professional</title>
<meta name="description" content="Learn Docker by doing it: short animations, a live Docker playground in your browser, and quizzes. Then move on to Kubernetes.">
<meta property="og:title" content="Dockside: learn Docker from zero to professional">
<meta property="og:description" content="Type Docker commands and watch what happens. Animations, a live playground, and quizzes, from beginner to professional.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F2A3D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='10' width='7' height='14' rx='1' fill='%232B6CB0'/%3E%3Crect x='12.5' y='10' width='7' height='14' rx='1' fill='%2325775A'/%3E%3Crect x='22' y='10' width='7' height='14' rx='1' fill='%23E6B22E'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EDF2F4; --surface:#FFFFFF; --ink:#0F2A3D; --muted:#4A6070; --line:#C6D3DA;
  --blue:#2B6CB0; --green:#25775A; --yellow:#E6B22E; --red:#B83A2E; --on-yellow:#1C1500;
  --display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1B27; --surface:#15293A; --ink:#E6EEF3; --muted:#9DB2C0; --line:#2A4256;
    --blue:#3375BF; --green:#2A8566; --yellow:#E6B22E; --red:#C24334;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
code,pre{font-family:var(--mono)}
code{font-size:.92em;background:color-mix(in srgb,var(--ink) 9%,transparent);padding:1px 6px;border-radius:4px}
pre{margin:12px 0;padding:14px 16px;background:color-mix(in srgb,var(--ink) 8%,var(--surface));border:1px solid var(--line);border-radius:6px;overflow:auto;font-size:14px;line-height:1.5}
pre code{background:none;padding:0;font-size:inherit}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:800 24px var(--display);letter-spacing:-.01em}
.brand i{display:flex;gap:2px}
.brand i b{display:block;width:10px;height:14px;border-radius:2px}
.brand i b:nth-child(1){background:var(--blue)}
.brand i b:nth-child(2){background:var(--green)}
.brand i b:nth-child(3){background:var(--yellow)}
.score{display:flex;gap:18px;font-size:14px;color:var(--muted)}
.score b{color:var(--ink);font-variant-numeric:tabular-nums}

/* hero */
.hero{padding:44px 0 20px}
.hero h1{font-size:clamp(40px,8vw,76px);font-weight:800;max-width:11em}
.lede{font-size:18px;max-width:34em;color:var(--muted);margin:14px 0 22px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 0}
.stg{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.stg b{font:800 20px var(--display)}
.stg span{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column-reverse;gap:2px;width:54px;height:58px;justify-content:flex-start}
.stack i{display:block;height:10px;border-radius:2px;background:var(--blue);border-bottom:3px solid rgba(0,0,0,.3)}
@media (max-width:700px){.stages{grid-template-columns:repeat(2,1fr)}}
.loaded{margin:22px 0 8px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.slots8{display:flex;gap:3px;flex-wrap:wrap}
.slots8 i{width:14px;height:12px;border-radius:2px;background:var(--line)}
.slots8 i.on{background:var(--ink)}

/* level map */
.track{margin:34px 0 8px}
.track>h2{font-size:32px;font-weight:800}
.track>p{margin:2px 0 6px;color:var(--muted);font-size:15px}
.sub{margin:18px 0 10px}
.sub h3{font-size:22px;font-weight:800}
.sub p{margin:0 0 10px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.c-blue{--c:var(--blue);--on:#fff}
.c-green{--c:var(--green);--on:#fff}
.c-yellow{--c:var(--yellow);--on:var(--on-yellow)}
.c-red{--c:var(--red);--on:#fff}
.box{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:150px;padding:26px 16px 20px;border:0;border-bottom:8px solid rgba(0,0,0,.3);border-radius:4px;background:var(--c);color:var(--on);overflow:hidden;transition:transform .12s}
.box::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 3px,transparent 3px 11px);pointer-events:none}
.box::after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:rgba(0,0,0,.3)}
.box>*{position:relative}
.box:hover{transform:translateY(-3px)}
.box .lv{font-size:13px;opacity:.9}
.box .nm{font:800 26px/1.05 var(--display)}
.box .bl{font-size:14px;opacity:.95}
.stamp{position:absolute!important;top:18px;right:12px;transform:rotate(8deg);border:2px solid currentColor;border-radius:3px;padding:0 8px;font:800 14px var(--display);background:rgba(0,0,0,.18)}

/* cheat sheet */
.cheat{margin:44px 0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cheat section{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.cheat h3{font-size:22px;margin-bottom:8px}
.cheat dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.cheat dt{white-space:nowrap}
.cheat dd{margin:0;color:var(--muted)}
.foot{padding:20px 0 40px;color:var(--muted);font-size:13px}

/* level runner */
.runbar{display:flex;align-items:center;gap:14px;padding:22px 0 14px}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.prog{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--ink));transition:width .25s}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{background:var(--surface);border:1px solid var(--line);border-left:12px solid var(--c);border-radius:6px;padding:24px clamp(16px,4vw,32px) 28px;margin-bottom:40px}
.stage .who{font-size:13px;color:var(--muted);margin-bottom:4px}
.stage h2{font-size:34px;font-weight:800;margin-bottom:14px}
.q{font-size:26px;font-weight:800;margin:0 0 14px}
.lesson p,.lesson li{max-width:42em}
.lesson ul,.lesson ol{padding-left:20px}
.lesson li{margin:5px 0}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.again{display:inline-block;margin:0 0 10px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--yellow) 35%,transparent);font-size:13px}
.btn{margin-top:18px;padding:11px 22px;border:0;border-radius:6px;background:var(--ink);color:var(--bg);font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:none;color:var(--ink);border:2px solid var(--ink);margin-left:10px}
.btn.sm{margin:0;padding:6px 14px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.eg{margin:14px 0;padding:10px 14px;border-left:4px solid var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,var(--surface));border-radius:0 6px 6px 0;max-width:42em}
.eg b{font-family:var(--display);font-size:18px;margin-right:6px}
.annot{border-collapse:collapse;margin:12px 0;font-size:14px;max-width:640px;width:100%}
.annot td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.annot td:first-child{font-family:var(--mono);white-space:nowrap}
.annot td:last-child{color:var(--muted)}
.cap{font-size:13px;color:var(--muted);margin:6px 0 12px}

/* quiz */
.opts{display:grid;gap:10px;max-width:640px}
.opt{text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:6px;background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right,.mt.right,.slot.right,.sp.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--surface))}
.opt.wrong,.mt.wrong,.slot.wrong,.sp.miss{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--surface))}
.opt:disabled{cursor:default}
.fb{margin-top:16px;max-width:640px}
.fb strong{font:800 20px var(--display)}
.fb p{margin:6px 0 0}

/* order puzzle */
.slots{display:grid;gap:6px;max-width:640px;margin-bottom:14px}
.slot{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 12px;border:2px dashed var(--line);border-radius:6px;background:transparent;text-align:left}
.slot.filled{border-style:solid;background:var(--surface)}
.slot .n{width:20px;font-size:13px;color:var(--muted);text-align:right}
.pool{display:flex;flex-wrap:wrap;gap:8px;max-width:640px;min-height:46px}
.chip{padding:8px 12px;border:2px solid var(--ink);border-radius:6px;background:var(--surface)}
.chip:hover{background:color-mix(in srgb,var(--ink) 8%,var(--surface))}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;max-width:760px}
.col{display:grid;gap:10px;align-content:start}
.mt{text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:6px;background:var(--surface);min-height:52px}
.mt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.mt:disabled{cursor:default}
@media (max-width:560px){.match{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.mt.wrong{animation:shake .3s}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* spot the problems */
.sp{display:block;width:100%;text-align:left;padding:8px 12px;border:2px solid var(--line);border-radius:6px;background:var(--surface);margin:5px 0;font:13px var(--mono)}
.sp.sel{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.sp.false{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 18%,var(--surface))}
.sp small{display:block;font:13px var(--body);color:var(--muted);margin-top:3px}
.spw{max-width:640px}

/* visuals */
.vz{margin:14px 0;max-width:680px}
.vz.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.vz.two{grid-template-columns:1fr}}
.vbox{padding:14px;border:2px solid var(--line);border-radius:6px;display:grid;gap:4px;font-size:14px}
.vbox b{font:800 20px var(--display)}
.vbox i{font-style:normal;font-weight:700}
.vbox.ok{border-color:var(--green)}.vbox.ok i{color:var(--green)}
.vbox.bad{border-color:var(--red)}.vbox.bad i{color:var(--red)}
.stk{display:grid;gap:4px;font-size:13px;text-align:center;align-content:end}
.stk h4{font-size:20px;text-align:left;margin-bottom:4px}
.stk .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.stk .b{padding:10px 4px;border-radius:3px;background:var(--line)}
.stk .app{background:var(--blue);color:#fff;border-bottom:5px solid rgba(0,0,0,.3)}
.stk .app.heavy{padding:26px 4px}
.stk .app small{display:block;font-size:11px;opacity:.9}
.stk .mid{background:color-mix(in srgb,var(--blue) 30%,var(--surface))}
.layers{display:grid;gap:3px;max-width:460px;margin:14px 0 4px}
.ly{padding:9px 14px;background:color-mix(in srgb,var(--blue) 18%,var(--surface));border:1px solid var(--blue);border-radius:3px;font-size:14px}
.ly b{font-family:var(--mono);font-size:13px}
.ly small{display:block;color:var(--muted);font-size:12px}
.ly.w{background:color-mix(in srgb,var(--yellow) 30%,var(--surface));border-color:var(--yellow);border-style:dashed}
.ship{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0;font-size:14px}
.ship .st{padding:10px 14px;border-radius:4px;background:var(--blue);color:#fff;border-bottom:5px solid rgba(0,0,0,.3);font-weight:600}
.ship .st.g{background:var(--green)}
.ship .ar{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:12px}
.ship .ar::after{content:"→";font-size:20px;color:var(--ink)}
.tagz{display:flex;flex-wrap:wrap;margin:16px 0;font:600 18px var(--mono)}
.tagz span{display:flex;flex-direction:column;align-items:center;padding:0 2px}
.tagz small{font:12px var(--body);color:var(--muted);border-top:3px solid var(--blue);margin-top:4px;padding-top:3px;width:100%;text-align:center}
.tagz span:nth-child(3) small{border-color:var(--green)}
.tagz span:nth-child(5) small{border-color:var(--yellow)}
.tagz span:nth-child(7) small{border-color:var(--red)}
.vsvg{width:100%;height:auto;color:var(--ink)}
.vsvg text{fill:currentColor;font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){.fl{stroke-dasharray:6 6;animation:dash 1s linear infinite}}
@keyframes dash{to{stroke-dashoffset:-12}}
.memo{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin:14px 0}
.mbox{border:2px solid var(--ink);border-radius:6px;padding:10px 14px;min-width:150px;font-size:14px}
.mbox.g{border-color:var(--green)}
.mbox.dash{border-style:dashed}
.mbox b{display:block;font:800 18px var(--display)}
.memo .mid{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.net{border:2px dashed var(--blue);border-radius:8px;padding:10px 14px;margin:14px 0;max-width:520px}
.net>b{font:800 16px var(--display)}
.net .in{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.net .in .mbox{min-width:120px}
.bars{display:grid;gap:8px;margin:12px 0;max-width:640px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:20px;background:var(--blue);border-radius:3px;border-bottom:4px solid rgba(0,0,0,.3);transition:width .3s}
.bar.g i{background:var(--green)}
@media (max-width:520px){.bar{grid-template-columns:90px 1fr 56px}}

/* animation player */
.sc{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--blue) 6%,var(--surface));overflow:hidden;font-size:clamp(9.5px,2.1vw,15px)}
.ac{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:0 .4em;transition:left .8s ease,top .8s ease,opacity .5s ease,transform .4s ease,background-color .4s ease,width .8s ease,height .8s ease}
.ac b{font-weight:700}
.ac small{font-size:.82em;opacity:.92}
.ac.blk{border-radius:4px;border-bottom:.35em solid rgba(0,0,0,.3);color:#fff;background:var(--blue)}
.ac.blk.green{background:var(--green)}
.ac.blk.red{background:var(--red)}
.ac.blk.gray{background:var(--muted)}
.ac.blk.yellow{background:var(--yellow);color:var(--on-yellow)}
.ac.blk.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.ac.zone{border:2px dashed var(--muted);border-radius:8px;justify-content:flex-start;align-items:flex-start;text-align:left;padding:.35em .6em;color:var(--muted)}
.ac.chip{font-family:var(--mono);background:#0B1620;color:#D6E4EC;border-radius:4px;font-size:.88em;white-space:nowrap;padding:0 .2em}
.ac.chip b{font-weight:600}
.ac.note{color:var(--ink)}
.ac.note.good{color:var(--green)}
.ac.note.bad{color:var(--red)}
.ac.file{background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:3px 14px 3px 3px;font-family:var(--mono);font-size:.82em}
.ac.dot{border-radius:50%;background:var(--yellow);border:2px solid var(--ink);padding:0}
@media (prefers-reduced-motion:reduce){.ac{transition:none}}
@media (max-width:560px){.sc{aspect-ratio:4/3;font-size:10px}.stage{padding-left:12px;padding-right:12px;border-left-width:6px}.capt{font-size:17px}}
.capt{min-height:3.1em;font-size:19px;font-weight:600;line-height:1.35;margin:14px 0 8px;max-width:760px}
.pl .btn{margin-top:0}
.btn.out{background:none;color:var(--ink);border:2px solid var(--ink);padding:4px 14px}
.btn.out:disabled{opacity:.35}
.ph{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;border:1px solid var(--c);color:var(--ink);font-size:12px}
.how{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.how button{padding:9px 16px;border-radius:999px;background:var(--surface);border:2px solid var(--ink);font-size:14px;font-weight:600}
.how button:hover{background:var(--ink);color:var(--bg)}
.how b{margin-right:6px}

/* live Docker playground */
.wrap.wide{max-width:1240px}
.lab2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"h h" "w g" "w t";gap:12px 18px;align-items:start}
.lh{grid-area:h;list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
.lh li{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 6px;border-radius:999px;background:color-mix(in srgb,var(--yellow) 24%,var(--surface));border:1px solid var(--yellow)}
.lh b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px}
.wleg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.wleg .k{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ki{background:var(--blue)}.kr{background:var(--green)}.ks{background:var(--muted)}.kf{background:var(--red)}
.pick{cursor:pointer}
.pick:hover{outline:2px solid var(--ink);outline-offset:2px}
.xpl{margin-top:8px;font-size:13.5px}
.xpl .xh{color:var(--muted);font-size:12px;margin-bottom:2px}
.xrow{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:10px;padding:3px 0;align-items:baseline}
.xrow code{overflow-wrap:anywhere}
.coach{margin-top:10px;padding:10px 14px;border-radius:0 6px 6px 0;border-left:6px solid var(--green);background:color-mix(in srgb,var(--green) 10%,var(--surface));font-size:14.5px}
.coach.bad{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--surface))}
.coach.info{border-left-color:var(--blue);background:color-mix(in srgb,var(--blue) 9%,var(--surface))}
.coach b{display:block;font:800 17px var(--display);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chl{font-size:13px;color:var(--muted)}
.chipb{padding:5px 10px;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);font:13px var(--mono);text-align:left}
.chipb:hover{background:var(--ink);color:var(--bg)}
.sugg{margin-top:12px}
.sugg h3{font-size:18px;margin-bottom:4px}
.sugg button{display:grid;gap:1px;width:100%;text-align:left;padding:8px 12px;margin:6px 0 0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.sugg button:hover{border-color:var(--ink)}
.sugg button code{background:none;padding:0;font-size:13.5px;overflow-wrap:anywhere}
.sugg button span{font-size:13px;color:var(--muted)}
.tin input::placeholder{color:#8FA6B5}
.lab2 .lw{grid-area:w}
.lab2 .lg{grid-area:g}
.lab2 .lt2{grid-area:t}
@media (max-width:900px){.lab2{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"h" "g" "w" "t"}}
.world{border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--blue) 6%,var(--surface));padding:12px;display:grid;gap:10px;font-size:13px}

function save() { if (!store) return; try { store.setItem('dockside-v2', JSON.stringify({ xp: state.xp, done: [...state.done], missed: [...state.missed], day: state.day, name: state.name, votes: state.votes })); } catch (e) {} }
function load() { if (!store) return; try { const d = JSON.parse(store.getItem('dockside-v2') || 'null'); if (d) { state.xp = d.xp || 0; (d.done || []).forEach(x => state.done.add(x)); (d.missed || []).forEach(x => state.missed.add(x)); if (d.day && d.day.last) state.day = { last: String(d.day.last), days: +d.day.days || 0 }; state.name = String(d.name || '').slice(0, 60); if (d.votes && typeof d.votes === 'object') Object.keys(d.votes).forEach(k => { if (d.votes[k] === 'yes' || d.votes[k] === 'no') state.votes[k] = d.votes[k]; }); } } catch (e) {} }

const statsOn = /^[a-z0-9-]+$/i.test(CONFIG.stats || '');
const trackQ = [];
function track(path, title, event) {
  if (!statsOn) return;
  const v = { path, title: title || path, event: !!event };
  if (window.goatcounter && window.goatcounter.count) { try { window.goatcounter.count(v); } catch (e) {} } else trackQ.push(v);
}
function initStats() {
  if (!statsOn || !document.head) return;
  window.goatcounter = { no_onload: true };
  const s = document.createElement('script');
  s.async = true; s.src = 'https://gc.zgo.at/count.js'; s.setAttribute('data-goatcounter', `https://${CONFIG.stats}.goatcounter.com/count`);
  s.onload = () => { const t = setInterval(() => { if (window.goatcounter && window.goatcounter.count) { clearInterval(t); trackQ.splice(0).forEach(v => { try { window.goatcounter.count(v); } catch (e) {} }); } }, 100); };
  document.head.appendChild(s);
}
const formOn = () => { const f = CONFIG.feedbackForm || {}; return /^https:\/\/docs\.google\.com\/forms\/.+\/formResponse$/.test(f.url || '') && !!f.comment; };
function sendForm(page, helpful, comment) {
  const f = CONFIG.feedbackForm;
  if (!formOn() || !window.fetch || !window.FormData) return false;
  const d = new FormData();
  if (f.page) d.append(f.page, page); if (f.helpful) d.append(f.helpful, helpful); d.append(f.comment, comment);
  try { fetch(f.url, { method: 'POST', mode: 'no-cors', body: d }).catch(() => {}); } catch (e) { return false; }
  return true;
}
function feedbackBox(el, key, page, general) {
  let vote = general ? 'general' : (state.votes[key] || '');
  let sent = false, stage = vote ? 'comment' : 'ask';
  const draw = () => {
    if (stage === 'ask') {
      el.innerHTML = `<h2>Was this page helpful?</h2><div class="row"><button type="button" class="vbtn" data-v="yes">Yes</button><button type="button" class="vbtn" data-v="no">No</button></div>`;
      el.querySelectorAll('[data-v]').forEach(b => { b.onclick = () => { vote = b.dataset.v; state.votes[key] = vote; save(); track('helpful-' + vote + '-' + key, page, true); sendForm(page, vote, ''); stage = 'comment'; draw(); }; });
      return;
    }
    if (sent === 'form') { el.innerHTML = `<h2>Sent. Thank you.</h2><p>Your comment helps make this page better for the next learner.</p>`; return; }
    if (sent) {
      el.innerHTML = `<h2>One more step</h2><p>This site does not have its own feedback form yet. You can post your comment on GitHub instead. It opens in a new tab with your text filled in, and it needs a free GitHub account.</p><a class="btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="${esc(sent)}">Post it on GitHub</a>`;
      return;
    }
    el.innerHTML = `<h2>${general ? 'Send feedback' : 'Thank you.'}</h2><p>${general ? 'What should be better on this site? What confused you?' : vote === 'yes' ? 'Glad it helped. Is there anything that would make it better? This is optional.' : 'Sorry about that. What was confusing or missing? This is optional.'}</p>
      <label class="sr" for="fbt">Your comment</label><textarea id="fbt" maxlength="1000" placeholder="Type your comment"></textarea>
      <div class="row"><button type="button" class="btn" id="fbs" style="margin-top:8px">Send</button></div><p class="cap">Please do not include personal details.</p>`;
    $('#fbs', el).onclick = () => {
      const text = ($('#fbt', el).value || '').trim().slice(0, 1000);
      if (!text) { $('#fbt', el).focus(); return; }
      track('comment-' + key, page, true);
      if (sendForm(page, vote, text)) sent = 'form';
      else sent = `https://github.com/${CONFIG.repo}/issues/new?title=${encodeURIComponent('Feedback: ' + page)}&body=${encodeURIComponent((general ? '' : 'Helpful: ' + vote + '\n\n') + text)}`;
      draw();
    };
  };
  draw();
}
function feedbackPage() {
  shell('fb', 'yellow', `<h1>Feedback</h1><p class="lede">Tell us what works and what does not. Every comment is read.</p><section class="sec fbk" id="fbk"></section>`);
  feedbackBox($('#fbk'), 'general', 'General feedback', true);
  nav('feedback'); track('/feedback', 'Feedback');
}

  { type: 'quiz', q: "Why avoid the `:latest` tag in production?", options: ["It can change without warning, so builds differ over time", "It is not allowed by Docker", "It makes the image bigger", "It stops the container from starting"], answer: 0, why: "Pin an exact version so you get the same result every time." },
  { type: 'quiz', q: "Which command uploads an image to a registry?", options: ["`docker push`", "`docker pull`", "`docker build`", "`docker run`"], answer: 0, why: "Push uploads. Pull downloads." }
]},
{ id: 5, track: 'Docker', stage: 'Builder', color: 'blue', title: 'Your first Dockerfile', blurb: 'Package a real app, line by line.', steps: [
  { type: 'lesson', title: "A tiny real app", body: `
    <p>Here is a small Python web app. It answers every request with one sentence.</p>
<pre><code># app.py
from flask import Flask
app = Flask(__name__)

@app.route("/")
def hi():
    return "Hello from my container!"

app.run(host="0.0.0.0", port=5000)</code></pre>
<pre><code># requirements.txt
flask</code></pre>
    <p>Notice <code>host="0.0.0.0"</code>. Inside a container, the app must listen on all addresses, or nothing outside can reach it.</p>` },
  { type: 'lesson', title: "The Dockerfile, line by line", body: `
    <p>A Dockerfile is a recipe. Each line is one instruction.</p>
    <table class="annot">
      <tr><td>FROM python:3.11-slim</td><td>Start from a small Python image</td></tr>
      <tr><td>WORKDIR /app</td><td>Work inside the /app folder</td></tr>
      <tr><td>COPY requirements.txt .</td><td>Copy the list of libraries</td></tr>
      <tr><td>RUN pip install -r requirements.txt</td><td>Install them. This runs once, at build time</td></tr>
      <tr><td>COPY . .</td><td>Copy your code</td></tr>
      <tr><td>EXPOSE 5000</td><td>Note which port the app uses (documentation only)</td></tr>
      <tr><td>CMD ["python", "app.py"]</td><td>The command that starts the app</td></tr>
    </table>` },
  { type: 'order', prompt: "Put this Dockerfile in the right order.", items: [
    'FROM python:3.11-slim', 'WORKDIR /app', 'COPY requirements.txt .', 'RUN pip install -r requirements.txt', 'COPY . .', 'CMD ["python", "app.py"]' ],
    why: "Base image first, then libraries, then your code. Libraries change rarely, so Docker can reuse that cached layer when only your code changes." },
  { type: 'terminal', title: "Build it and run it", tasks: [
    { ask: "Build an image called myapp from the current folder.", a: "docker build -t myapp .", ok: T.re(/^docker build (-t|--tag) myapp(:latest)? \.$|^docker build \. (-t|--tag) myapp(:latest)?$/), out: ["[+] Building 42.1s (10/10) FINISHED", " => [1/5] FROM docker.io/library/python:3.11-slim", " => [2/5] WORKDIR /app", " => [3/5] COPY requirements.txt .", " => [4/5] RUN pip install -r requirements.txt", " => [5/5] COPY . .", " => exporting to image", " => => naming to docker.io/library/myapp"] },
    { ask: "Run it in the background and map port 5000 to 5000.", a: "docker run -d -p 5000:5000 myapp", ok: T.run('-d', '-p', '5000:5000', 'myapp'), out: ["4b7e9d2a1c5f8e3b6a0d9c7e5f1a3b8d2c4e6f0a1b3d5c7e9f2a4b6c8d0e1f3a"] },
    { ask: "Call your app with curl on port 5000.", a: "curl localhost:5000", ok: T.re(/^curl (http:\/\/)?(localhost|127\.0\.0\.1):5000\/?$/), out: ["Hello from my container!"] }
  ] },
  { type: 'quiz', q: "What does `FROM python:3.11-slim` do?", options: ["Sets the base image to build on", "Copies Python onto your laptop", "Starts the app", "Deletes old images"], answer: 0, why: "Every image starts from a base. Here it is a small Python 3.11 image." },
  { type: 'quiz', q: "What is the difference between `RUN` and `CMD`?", options: ["RUN happens while building the image. CMD is what runs when the container starts", "RUN starts the container. CMD builds the image", "They are the same", "CMD installs libraries. RUN copies files"], answer: 0, why: "RUN bakes results into the image. CMD is the default start command." },
  { type: 'quiz', q: "Does `EXPOSE 5000` make the port reachable from your computer?", options: ["No. It is documentation. You still need `-p`", "Yes, it opens the port automatically", "Yes, but only on Linux", "No, and `-p` doesn't work either"], answer: 0, why: "EXPOSE only documents the port. `docker run -p 5000:5000` is what publishes it." },
  { type: 'quiz', q: "Why does the app use `host=\"0.0.0.0\"`?", options: ["So it accepts connections from outside the container", "To make the app faster", "To hide the app", "Because Flask requires it"], answer: 0, why: "If an app listens only on 127.0.0.1 inside the container, requests that come in through the published port can't reach it." }
]},
{ id: 6, track: 'Docker', stage: 'Builder', color: 'blue', title: 'Build smarter', blurb: 'Use the cache. Keep junk out.', steps: [
  { type: 'lesson', title: "Docker remembers each step", visual: 'layers', body: `
    <p>Every Dockerfile line makes a layer, and Docker caches it. On the next build, a layer is reused if its input didn't change.</p>
    <p><b>The rule:</b> once one layer changes, every layer after it must be rebuilt.</p>
    <p>So put things that change rarely (libraries) first, and things that change often (your code) last.</p>` },
  { type: 'demo', name: 'build' },
  { type: 'lesson', title: "Keep junk out with .dockerignore", body: `
    <p>When you build, Docker sends your whole folder to the builder. A <code>.dockerignore</code> file lists what to skip.</p>
<pre><code>.git
__pycache__/
*.pyc
.env
node_modules/</code></pre>
    <ul><li>Faster builds, because less is sent.</li><li>Smaller images.</li><li>Secrets such as <code>.env</code> never end up inside an image.</li></ul>` },
  { type: 'quiz', q: "You change one line of your app code. In the smart Dockerfile, which steps rebuild?", options: ["Only `COPY . .` and the steps after it", "Everything", "Only `FROM`", "Nothing"], answer: 0, why: "The library install comes before the code copy, so its cache stays valid." },
  { type: 'quiz', q: "What is a `.dockerignore` file for?", options: ["Keeping files like .git and .env out of the build and the image", "Ignoring Docker errors", "Hiding containers", "Skipping the FROM line"], answer: 0, why: "It works like .gitignore, but for what Docker copies into the build." },
  { type: 'quiz', q: "You edit `requirements.txt`. What gets rebuilt in the smart Dockerfile?", options: ["The library install and every step after it", "Only the code copy", "Nothing", "Only the CMD"], answer: 0, why: "The changed file invalidates the `COPY requirements.txt` layer, so every layer after it rebuilds." }
]},
{ id: 7, track: 'Docker', stage: 'Practitioner', color: 'blue', title: 'Ports and networking', blurb: 'How requests reach a container.', steps: [
  { type: 'lesson', title: "A container is closed by default", visual: 'ports', body: `
    <p>A running container has its own private network. Your browser can't reach it until you <b>publish</b> a port.</p>
    <p>The format is <code>-p HOST:CONTAINER</code>. The container port must be the port the app listens on.</p>` },
  { type: 'demo', name: 'ports' },
  { type: 'lesson', title: "Containers talk by name", visual: 'net', body: `
    <p>Containers on the same <b>user-defined network</b> reach each other by container name. No IP addresses needed.</p>
    <div class="eg"><b>Careful</b>Inside a container, <code>localhost</code> means <i>that container itself</i>. To reach a database in another container, use its name, for example <code>db</code>.</div>` },
  { type: 'terminal', title: "Put two containers on one network", tasks: [
    { ask: "Create a network called appnet.", a: "docker network create appnet", ok: T.re(/^docker network create appnet$/), out: ["7c1e5a9b3d2f4a6c8e0b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1a3c"] },
    { ask: "Start postgres as db on appnet, with the password secret (-e POSTGRES_PASSWORD=secret).", a: "docker run -d --name db --network appnet -e POSTGRES_PASSWORD=secret postgres", ok: T.run('-d', '--name', 'db', '--network', 'appnet', '-e', 'POSTGRES_PASSWORD=secret', 'postgres'), out: ["Unable to find image 'postgres:latest' locally", "Status: Downloaded newer image for postgres:latest", "e2d41b7c9a0f5e8d3c6b1a4f7e0d9c2b5a8f1e4d7c0b3a6f9e2d5c8b1a4f7e0d"] },
    { ask: "Start your app as web on the same network, with port 5000:5000.", a: "docker run -d --name web --network appnet -p 5000:5000 myapp", ok: T.run('-d', '--name', 'web', '--network', 'appnet', '-p', '5000:5000', 'myapp'), out: ["4b7e9d2a1c5f8e3b6a0d9c7e5f1a3b8d2c4e6f0a1b3d5c7e9f2a4b6c8d0e1f3a", "~Inside web, your code can now connect to the host name db."] }
  ] },
  { type: 'quiz', q: "In `docker run -p 8080:80 nginx`, which port is opened on your computer?", options: ["8080", "80", "Both", "Neither"], answer: 0, why: "The format is host:container. Browse to localhost:8080 and Docker forwards to port 80 inside." },
  { type: 'quiz', q: "Your web container needs to reach a database container. What host name should it use?", options: ["The database container's name, such as `db`", "`localhost`", "`0.0.0.0`", "Your laptop's name"], answer: 0, why: "`localhost` inside a container is the container itself. On a shared network, container names work as host names." },
  { type: 'quiz', q: "The app inside the container listens on port 3000, but you ran `-p 8080:80`. What happens?", options: ["The request fails, because nothing listens on port 80 in the container", "It works, Docker fixes the port", "It works only on Windows", "Docker changes the app's port"], answer: 0, why: "The container port in `-p` must match the port the app really listens on." }
]},
{ id: 8, track: 'Docker', stage: 'Practitioner', color: 'blue', title: 'Data and volumes', blurb: 'Keep data when containers go away.', steps: [
  { type: 'lesson', title: "Containers forget", visual: 'volume', body: `
    <p>Anything a container writes goes into its thin writable layer. Remove the container and that data is gone.</p>
    <p>For data you want to keep, such as a database, mount a <b>volume</b>. A volume lives outside the container.</p>` },
  { type: 'demo', name: 'volume' },
  { type: 'lesson', title: "Two ways to mount data", body: `
    <table class="annot">
      <tr><td>Volume</td><td>Managed by Docker. Best for databases and data you want to keep. <code>-v mydata:/data</code></td></tr>
      <tr><td>Bind mount</td><td>A folder from your computer. Best in development, so code edits show up instantly. <code>-v $(pwd):/app</code></td></tr>
    </table>` },
  { type: 'terminal', title: "Keep a database's data", tasks: [
    { ask: "Create a volume called mydata.", a: "docker volume create mydata", ok: T.re(/^docker volume create mydata$/), out: ["mydata"] },
    { ask: "Run postgres as db (password secret) with mydata mounted at /var/lib/postgresql/data.", a: "docker run -d --name db -e POSTGRES_PASSWORD=secret -v mydata:/var/lib/postgresql/data postgres", ok: v => v.startsWith('docker run ') && v.includes('-v mydata:/var/lib/postgresql/data') && v.includes('POSTGRES_PASSWORD=') && v.split(' ').includes('postgres'), out: ["e2d41b7c9a0f5e8d3c6b1a4f7e0d9c2b5a8f1e4d7c0b3a6f9e2d5c8b1a4f7e0d"] },
    { ask: "List your volumes.", a: "docker volume ls", ok: T.re(/^docker volume ls$|^docker volume list$/), out: ["DRIVER    VOLUME NAME", "local     mydata"] },
    { ask: "Run myapp on port 5000 with your current folder mounted at /app (a bind mount).", a: "docker run -d -p 5000:5000 -v $(pwd):/app myapp", ok: v => v.startsWith('docker run ') && /-v (\$\(pwd\)|\$PWD|\$\{PWD\}|\/\S+):\/app/.test(v) && v.endsWith(' myapp'), out: ["4b7e9d2a1c5f8e3b6a0d9c7e5f1a3b8d2c4e6f0a1b3d5c7e9f2a4b6c8d0e1f3a", "~Edit app.py on your computer and the container sees the change."] }
  ] },
  { type: 'quiz', q: "A container writes a file, with no volume. You remove the container. What happens to the file?", options: ["It is lost", "It stays in the image", "It moves to Docker Hub", "It is saved on your desktop"], answer: 0, why: "The file lived in the container's writable layer, which is deleted with the container." },
  { type: 'quiz', q: "Which is the best fit for a database's data?", options: ["A named volume", "The container's writable layer", "An environment variable", "The Dockerfile"], answer: 0, why: "A volume outlives the container and is managed by Docker." },
  { type: 'quiz', q: "When is a bind mount (`-v $(pwd):/app`) most useful?", options: ["During development, so code changes show up without rebuilding", "In production databases", "To make images smaller", "To publish a port"], answer: 0, why: "A bind mount links a folder on your computer into the container, so edits are visible straight away." }
]},
{ id: 9, track: 'Docker', stage: 'Practitioner', color: 'blue', title: 'Docker Compose', blurb: 'Run a whole app with one command.', steps: [
  { type: 'lesson', title: "One file, one command", visual: 'compose', body: `
    <p>Real apps have several parts: a web app, a database, maybe a cache. Typing a long <code>docker run</code> for each is painful.</p>
    <p><b>Docker Compose</b> lets you describe all of them in one YAML file and start everything with <code>docker compose up</code>.</p>` },
  { type: 'lesson', title: "Read the compose file", body: `
<pre><code>services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:</code></pre>
    <ul><li>Each entry under <code>services</code> becomes a container.</li><li><code>build: .</code> builds your Dockerfile. <code>image:</code> pulls a ready image.</li><li>Compose puts the services on one network, so <code>web</code> reaches the database at <code>db</code>.</li><li>The password here is only for a demo. Real projects use secrets.</li></ul>` },
  { type: 'demo', name: 'compose' },
  { type: 'quiz', q: "In the compose file, how does `web` reach the database?", options: ["By the service name `db` as the host name", "By `localhost`", "By typing the container's IP address", "By the volume name"], answer: 0, why: "Compose creates a network where each service name works as a host name." },
  { type: 'quiz', q: "What does `docker compose up -d` do?", options: ["Creates the network and starts all services in the background", "Builds only the first service", "Deletes all containers", "Pushes images to a registry"], answer: 0, why: "One command starts the whole app. The -d flag runs it in the background." },
  { type: 'quiz', q: "What does `docker compose down` do?", options: ["Stops and removes the containers and network (volumes are kept)", "Deletes your volumes and images", "Only pauses the containers", "Rebuilds the images"], answer: 0, why: "Your data in named volumes survives. Add `-v` to remove volumes too." }
]},
{ id: 10, track: 'Docker', stage: 'Professional', color: 'blue', title: 'Debug and clean up', blurb: 'Find out why it broke.', steps: [
  { type: 'lesson', title: "When a container misbehaves", body: `
    <p>Work from the outside in. Ask in this order:</p>
    <ol><li>Is it running? <code>docker ps -a</code></li><li>What did it say? <code>docker logs</code></li><li>What does it look like inside? <code>docker exec</code></li><li>How is it configured? <code>docker inspect</code></li></ol>
    <div class="eg"><b>Real example</b>A container exits a second after it starts. <code>docker logs</code> shows "ModuleNotFoundError: No module named 'flask'". The fix is in requirements.txt, not in Docker.</div>` },
  { type: 'order', prompt: "Put the debugging steps in a sensible order.", items: [
    'docker ps -a  (is it running?)', 'docker logs <name>  (what did it say?)', 'docker exec -it <name> sh  (look inside)', 'docker inspect <name>  (check the setup)', 'Fix the Dockerfile and rebuild' ],
    why: "Check status, then read the logs, then look inside, then check the configuration. Fix the cause and rebuild." },
  { type: 'terminal', title: "Your debugging toolbox", intro: "Assume a container named web is running.", tasks: [
    { ask: "Follow the live logs of web.", a: "docker logs -f web", ok: T.re(/^docker logs (-f|--follow) web$/), out: ["Serving on http://0.0.0.0:5000", "172.17.0.1 - - \"GET / HTTP/1.1\" 200 -", "~Press Ctrl+C to stop following."] },
    { ask: "Open a shell inside web.", a: "docker exec -it web sh", ok: T.re(/^docker exec (-it|-ti) web (sh|bash)$/), out: ["# you are now inside the container", "# type exit to leave"] },
    { ask: "Show the full settings of web (ports, mounts, environment).", a: "docker inspect web", ok: T.re(/^docker inspect web$/), out: ["[", "  {", "    \"Name\": \"/web\",", "    \"State\": { \"Status\": \"running\" },", "    \"NetworkSettings\": { \"Ports\": { \"5000/tcp\": [{ \"HostPort\": \"5000\" }] } }", "  }", "]"] },
    { ask: "See how much CPU and memory containers use right now.", a: "docker stats", ok: T.re(/^docker stats( --no-stream)?$/), out: ["CONTAINER ID   NAME   CPU %   MEM USAGE / LIMIT", "4b7e9d2a1c5f   web    0.05%   28MiB / 7.7GiB"] },
    { ask: "Clean up stopped containers and unused data.", a: "docker system prune", ok: T.re(/^docker system prune( -f)?$/), out: ["WARNING! This will remove:", "  - all stopped containers", "  - all networks not used by at least one container", "  - all dangling images", "Total reclaimed space: 1.2GB"] }
  ] },
  { type: 'quiz', q: "What is `docker exec -it web sh` for?", options: ["Opening a shell inside a running container", "Starting a new container", "Building an image", "Deleting a container"], answer: 0, why: "exec runs a command inside a container that is already running. `-it` gives you an interactive terminal." },
  { type: 'quiz', q: "A container keeps stopping right after it starts. What do you check first?", options: ["`docker logs <name>`", "`docker push`", "`docker system prune`", "Nothing, restart your computer"], answer: 0, why: "The logs usually show the error that made the app exit." },
  { type: 'quiz', q: "Why be careful with `docker system prune`?", options: ["It deletes stopped containers and unused data you may still need", "It is slow", "It restarts Docker", "It uploads your images"], answer: 0, why: "Prune is handy, but check what it will remove before you confirm." }
]},
{ id: 11, track: 'Docker', stage: 'Professional', color: 'blue', title: 'Professional habits', blurb: 'Small, safe, and repeatable images.', steps: [
  { type: 'lesson', title: "What professionals do differently", body: `
    <table class="annot">
      <tr><td>Small base image</td><td>Faster pulls and fewer security holes. Use slim.</td></tr>
      <tr><td>Pinned versions</td><td>Same build every time. Avoid latest.</td></tr>
      <tr><td>Cache-friendly order</td><td>Libraries first, code last.</td></tr>
      <tr><td>.dockerignore</td><td>Keep junk and secrets out.</td></tr>
      <tr><td>Multi-stage builds</td><td>Leave build tools out of the final image.</td></tr>
      <tr><td>Non-root user</td><td>Limits damage if the app is hacked.</td></tr>
      <tr><td>No secrets in images</td><td>Pass them at run time.</td></tr>
      <tr><td>HEALTHCHECK</td><td>Docker can tell if the app really works.</td></tr>
      <tr><td>Image scanning</td><td>Find known vulnerabilities (for example Docker Scout, Trivy).</td></tr>
    </table>` },
  { type: 'spot', prompt: "This Dockerfile has problems. Tap every line you would change, then check.", lines: [
    { t: 'FROM python:latest', bad: true, why: "latest moves without warning and the full image is huge. Pin a version and use slim." },
    { t: 'WORKDIR /app', bad: false },
    { t: 'COPY . .', bad: true, why: "Copying everything first breaks the cache, and can copy secrets. Copy requirements.txt first." },
    { t: 'RUN pip install -r requirements.txt', bad: false },
    { t: 'ENV DB_PASSWORD=hunter2', bad: true, why: "A secret baked into the image can be read by anyone who has the image. Pass it at run time." },
    { t: 'USER root', bad: true, why: "Don't run as root. Create a normal user and switch to it." },
    { t: 'EXPOSE 5000', bad: false },
    { t: 'CMD ["python", "app.py"]', bad: false }
  ] },
  { type: 'demo', name: 'size' },
  { type: 'lesson', title: "A professional Dockerfile", visual: 'multistage', body: `
<pre><code>FROM python:3.11-slim AS build
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir --prefix=/install -r requirements.txt

FROM python:3.11-slim
RUN useradd --create-home appuser
WORKDIR /app
COPY --from=build /install /usr/local
COPY . .
USER appuser
HEALTHCHECK --interval=30s CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000')" || exit 1
CMD ["python", "app.py"]</code></pre>
    <p>Stage one installs the libraries. Stage two copies only the result, runs as a normal user, and has a health check.</p>` },
  { type: 'match', prompt: "Match each habit to why it matters.", pairs: [
    ["Slim base image", "Smaller image, faster pulls, fewer security holes"],
    ["Pin the version tag", "The same build every time"],
    ["Run as non-root", "Limits damage if the app is hacked"],
    ["Multi-stage build", "Keeps compilers and build tools out of the final image"],
    ["Secrets at run time", "Passwords never end up in image layers"] ] },
  { type: 'quiz', q: "Where should a database password come from?", options: ["Passed at run time (environment variable or secret manager)", "Hard-coded in the Dockerfile", "Committed in the code", "Written in the image name"], answer: 0, why: "Anything in an image layer can be read by whoever has the image." },
  { type: 'quiz', q: "What does a multi-stage build do?", options: ["Builds in one stage and copies only the result into a small final image", "Builds the image twice for speed", "Runs several containers", "Splits an image across registries"], answer: 0, why: "Compilers and caches stay in the build stage. The shipped image stays small." },
  { type: 'quiz', q: "What does `HEALTHCHECK` give you?", options: ["A way for Docker to test whether the app inside really works", "A faster build", "A bigger image", "Automatic backups"], answer: 0, why: "A running process isn't always a working app. A health check tests that it responds." }
]},
{ id: 12, track: 'Docker', stage: 'Professional', color: 'red', title: 'Docker exam', blurb: '10 random questions. Misses come back.', boss: 'docker', steps: [] },

/* ===== KUBERNETES ===== */
{ id: 13, track: 'Kubernetes', color: 'green', title: 'Why Kubernetes?', blurb: 'Who manages 100 boxes?', steps: [
  { type: 'lesson', title: "Docker runs boxes. Who manages them?", visual: 'clusterviz', body: `
    <p>You know how to build and run a container. Real systems run dozens of them across many machines:</p>
    <ul><li>Which machine should run which container?</li><li>What if one crashes at 3 a.m.?</li><li>What if traffic suddenly triples?</li></ul>
    <p><b>Kubernetes</b> (K8s) answers these. You describe what you want, such as "run 3 copies of this app", and Kubernetes keeps it true. The name is Greek for helmsman.</p>` },
  { type: 'quiz', q: "You tell Kubernetes you want 3 copies of your app. One crashes. What happens?", options: ["Kubernetes starts a replacement to get back to 3", "The app stays at 2 until you restart it", "Kubernetes shuts down all copies", "Docker reboots the machine"], answer: 0, why: "Kubernetes compares what you asked for (desired state) with what exists (actual state) and fixes any gap." },
  { type: 'match', prompt: "Match each Kubernetes object to its job.", pairs: [
    ["Pod", "Smallest unit: wraps one or more containers"],
    ["Node", "A machine that runs pods"],
    ["Deployment", "Keeps the right number of identical pods running"],
    ["Service", "A stable address that sends traffic to pods"] ] },
  { type: 'quiz', q: "Pods already have IP addresses. Why do we need a Service?", options: ["Pod IPs change when pods are replaced, so a Service gives a stable address", "Pods have no network at all", "A Service builds the images", "A Service stores the data"], answer: 0, why: "Pods come and go. The Service keeps one steady address and sends traffic to whichever pods are healthy." }
]},
{ id: 14, track: 'Kubernetes', color: 'green', title: 'Self-healing lab', blurb: 'Break a live cluster on purpose.', steps: [
  { type: 'lesson', title: 'Desired state versus actual state', body: `
    <p>You write down what you want: <b>3 pods</b>. Kubernetes keeps comparing that wish with reality and fixes any gap. This loop is the heart of Kubernetes.</p>
    <p>Next you get a small cluster of your own. Break it and watch it heal.</p>` },
  { type: 'sim' },
  { type: 'quiz', q: "You deleted a pod and a new one appeared a moment later. What did that?", options: ["The Deployment saw fewer pods than wanted and started one", "Your browser refreshed", "Docker rebuilt the image", "The pod fixed itself"], answer: 0, why: "The Deployment's controller noticed 2 running versus 3 wanted and created a replacement." },

    return `<div class="wc ${cls}" data-key="ct:${c.id}" data-sig="${c.status}${c.code}${c.files.length}">${c.status === 'running' ? '<i class="lt"></i>' : ''}<b>${esc(c.name)}</b><small>${esc(E.short(c.image))}</small><small>${c.status === 'running' ? 'running' : 'exited (' + c.code + ')'}</small>${bd.length ? `<div class="bd">${bd.join('')}</div>` : ''}</div>`;
  };
  function html() {
    const E = getE(), P = E.project;
    const loose = E.containers.filter(c => !E.networks.includes(c.net));
    return `
    <div class="w-reg"><span class="w-lab">Registry (Docker Hub)</span><div class="w-row">${REG.map(n => `<span class="wr" data-key="reg:${n}">${n}</span>`).join('')}${E.pushed.map(p => `<span class="wr mine" data-key="reg:${esc(p.ref)}">${esc(E.short(p.ref))}</span>`).join('')}</div></div>
    <div class="w-pc" data-key="pc"><span class="w-lab">Your computer</span>
      ${P ? `<div class="w-sec" data-key="proj"><span>Project folder</span><div class="wf">${Object.keys(P.files).map(f => `<button type="button" data-file="${esc(f)}">${esc(f)}</button>`).join('')}${P.editable ? '<button type="button" class="ed" data-edit="app.py">Edit app.py</button><button type="button" class="ed" data-edit="requirements.txt">Edit requirements.txt</button>' : ''}${P.dirty.code || P.dirty.req ? `<span class="dirty">changed: ${[P.dirty.code ? 'app.py' : '', P.dirty.req ? 'requirements.txt' : ''].filter(Boolean).join(', ')}</span>` : ''}</div></div>` : ''}
      <div class="w-sec"><span>Images (blueprints)</span><div class="w-row">${E.images.length ? E.images.map(i => `<div class="wi" data-key="img:${esc(i.ref)}" data-sig="${i.id}">${esc(E.short(i.ref))}<small>${i.size} · ${i.id.slice(0, 6)}</small></div>`).join('') : '<span class="w-empty">No images yet</span>'}</div></div>
      <div class="w-sec"><span>Containers</span><div class="w-row">${loose.map(c => ctHTML(E, c)).join('')}${E.networks.map(n => `<div class="wn" data-key="net:${esc(n)}"><span>network: ${esc(n)}</span><div class="w-row">${E.containers.filter(c => c.net === n).map(c => ctHTML(E, c)).join('')}</div></div>`).join('')}${!E.containers.length && !E.networks.length ? '<span class="w-empty">No containers yet</span>' : ''}</div></div>
      ${E.volumes.length ? `<div class="w-sec"><span>Volumes</span><div class="w-row">${E.volumes.map(v => `<div class="wv" data-key="vol:${esc(v.name)}" data-sig="${v.files.length}">${esc(v.name)}<small>${v.files.length ? esc(v.files.join(', ')) : 'empty'}</small></div>`).join('')}</div></div>` : ''}
    </div>
    <div class="w-br" data-key="browser"><b>Browser</b>${E.browser ? `<code>${E.browser.url}</code><span class="${E.browser.ok ? 'ok' : 'bad'}">${E.browser.ok ? '✓' : '✗'} ${esc(E.browser.text)}</span>` : '<span class="w-empty">Send a request with curl localhost:PORT</span>'}</div>`;
  }
  function ghost(rect, cls, text) {
    const g = document.createElement('div'); g.className = 'flyer ' + (cls || ''); g.textContent = text || '';
    g.style.left = rect.left + 'px'; g.style.top = rect.top + 'px'; document.body.appendChild(g); return g;
  }
  function fly(from, to, label, cls, after) {
    const a = q(from), b = q(to); if (!a || !b || !a.animate) { if (after) after(b); return; }
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const g = ghost({ left: ra.left + ra.width / 2 - 8, top: ra.top + ra.height / 2 - 8 }, cls, label);
    const dx = rb.left + rb.width / 2 - (ra.left + ra.width / 2), dy = rb.top + rb.height / 2 - (ra.top + ra.height / 2);
    const an = g.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px)`, opacity: 1, offset: .85 }, { transform: `translate(${dx}px,${dy}px)`, opacity: 0 }], { duration: 520, easing: 'ease-in-out' });
    an.onfinish = () => { g.remove(); if (after) after(b); };
  }
  function render(fx) {
    const old = {}, nodes = {};
    root.querySelectorAll('[data-key]').forEach(e => { old[e.dataset.key] = e.getBoundingClientRect(); nodes[e.dataset.key] = e; });
    root.innerHTML = html();
    const now = {}; root.querySelectorAll('[data-key]').forEach(e => { now[e.dataset.key] = e; });
    if (known && !REDUCED) {
      const flyAt = {}; (fx || []).forEach((f, i) => { if (f.fly) flyAt[f.fly[1]] = i; });
      for (const k in now) {
        const e = now[k];
        if (!known.has(k)) { e.classList.add('enter'); if (k in flyAt) e.style.animationDelay = (flyAt[k] * 520 + 440) + 'ms'; }
        else if (sigs[k] !== (e.dataset.sig || '')) e.classList.add('chg');
      }
      for (const k in old) if (!(k in now) && nodes[k].animate) {
        const g = nodes[k].cloneNode(true), r = old[k];
        g.classList.remove('enter', 'chg'); g.removeAttribute('data-key');
        Object.assign(g.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0, zIndex: 40, pointerEvents: 'none' });
        document.body.appendChild(g);
        g.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.6)' }], { duration: 380, easing: 'ease-in' }).onfinish = () => g.remove();
      }
      (fx || []).forEach((f, i) => {
        if (f.fly) later(() => fly(f.fly[0], f.fly[1], f.label), i * 520);
        if (f.pkt) later(() => fly('browser', f.pkt, '', 'pkt', b => { if (b) { b.classList.remove('chg'); void b.offsetWidth; b.classList.add('chg'); } }), i * 520);
      });
    }
    known = new Set(Object.keys(now)); sigs = {};
    for (const k in now) sigs[k] = now[k].dataset.sig || '';
    if (onPick) root.querySelectorAll('.wc,.wi,.wr,.wv').forEach(e => {
      e.tabIndex = 0; e.setAttribute('role', 'button'); e.classList.add('pick');
      const act = () => onPick(e.dataset.key);
      e.onclick = act; e.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); } };
    });
    if (onCmd) {
      root.querySelectorAll('[data-file]').forEach(b => { b.onclick = () => onCmd('cat ' + b.dataset.file); });
      root.querySelectorAll('[data-edit]').forEach(b => { b.onclick = () => onCmd('edit ' + b.dataset.edit); });
    }
  }
  return { render, reset() { known = null; sigs = {}; } };
}

/* ---------- hero demo ---------- */
function heroDemo(el) {
  const script = [['docker pull nginx', 'Download an image from the registry.'], ['docker run -d --name web -p 8080:80 nginx', 'Start a container from it.'], ['curl localhost:8080', 'Send a request through the port.'], ['docker stop web', 'Stop the container.'], ['docker rm web', 'Remove it. The image stays.']];
  let E = makeEngine();
  const world = makeWorld($('.world', el), () => E), tl = $('.term', el), cap = $('.capn', el);
  world.render();
  if (REDUCED) { script.slice(0, 3).forEach(s => E.exec(s[0])); world.render(); tl.textContent = '$ ' + script[2][0]; cap.textContent = 'Type commands and watch the picture change.'; return; }
  let i = 0;
  const typeNext = () => {
    if (i >= script.length) { later(() => { i = 0; E = makeEngine(); world.reset(); world.render(); typeNext(); }, 3200); return; }
    const [cmd, text] = script[i]; let k = 0; cap.textContent = text;
    const tick = () => {
      tl.textContent = '$ ' + cmd.slice(0, k);
      if (k < cmd.length) { k++; later(tick, 38); }
      else later(() => { const r = E.exec(cmd); world.render(r.fx); i++; later(typeNext, 1900); }, 320);
    };
    tick();
  };
  later(typeNext, 700);
}

const TOPIC = {
  1: { short: "A container packs an app with everything it needs, so it runs the same on any computer.", remember: ["The problem: the same code behaves differently on different machines.", "A container bundles the app, its libraries, and its settings.", "Containers share the host's operating system, so they are small and start fast.", "Docker is the tool that builds and runs containers."] },
  2: { short: "An image is a read-only blueprint, and a container is a running copy made from it.", remember: ["One image can start many containers.", "Images are built in layers, and the layers are read-only.", "A container adds a thin writable layer that disappears when the container is removed.", "Removing a container never removes its image."] },
  3: { short: "A handful of commands cover the whole life of a container: run, list, stop, start, remove.", remember: ["`docker run IMAGE` creates and starts a container.", "`-d` runs it in the background, `--name` names it, and `-p HOST:CONTAINER` opens a port.", "`docker ps` shows running containers. `docker ps -a` shows all of them.", "`docker logs NAME` is the first place to look when something is wrong."] },
  4: { short: "A registry is a shared shelf for images, and a tag names one exact version.", remember: ["`docker pull` downloads an image. `docker push` uploads one.", "An image name has four parts: registry, account, name, and tag.", "Without a tag, Docker uses `latest`, which can change over time.", "Pin an exact tag for anything important."] },
  5: { short: "A Dockerfile is a recipe, and `docker build` turns it into an image.", remember: ["`FROM` picks the base, `COPY` adds files, `RUN` runs a build step, and `CMD` sets the start command.", "`RUN` happens at build time. `CMD` happens when the container starts.", "`EXPOSE` only documents a port. You still need `-p`.", "Inside a container, an app must listen on 0.0.0.0."] },
  6: { short: "Docker caches each build step, so the order of the lines decides how fast rebuilds are.", remember: ["Once one layer changes, every layer after it rebuilds.", "Put things that change rarely first, and your code last.", "A `.dockerignore` file keeps junk and secrets out of the image."] },
  7: { short: "A container is closed off until you publish a port, and containers on one network find each other by name.", remember: ["`-p HOST:CONTAINER` connects a port on your computer to a port in the container.", "The container port must be the one the app listens on.", "Inside a container, `localhost` means that container itself.", "On a network you created, the container name works as the address."] },
  8: { short: "Data inside a container is lost when the container is removed, unless it lives in a volume.", remember: ["A volume lives outside the container and survives it.", "Use a named volume for databases: `-v mydata:/path`.", "Use a bind mount in development: `-v $(pwd):/app`."] },
  9: { short: "Docker Compose describes a whole multi-container app in one file and starts it with one command.", remember: ["Each service in the YAML file becomes a container.", "Services reach each other by service name.", "`docker compose up -d` starts everything. `docker compose down` removes it.", "Named volumes survive `down`, unless you add `-v`."] },
  10: { short: "Debug from the outside in: status, logs, a look inside, then the settings.", remember: ["`docker ps -a` shows what stopped, and its exit code.", "`docker logs NAME` usually shows the cause.", "`docker exec -it NAME sh` opens a shell in a running container.", "`docker inspect NAME` shows ports, mounts, and environment."] },
  11: { short: "Professional images are small, pinned, cache-friendly, and never contain secrets.", remember: ["Use a slim base image and pin its version.", "Use a multi-stage build to leave build tools behind.", "Run as a normal user, not root.", "Pass secrets at run time, never in the image."] },
  13: { short: "Kubernetes runs many containers across many machines and keeps the number you asked for.", remember: ["A pod wraps one or more containers.", "A Deployment keeps the right number of pods running.", "A Service gives pods one stable address.", "You describe what you want, and Kubernetes makes it true."] },
  14: { short: "Kubernetes keeps comparing what you want with what exists, and fixes the gap.", remember: ["Desired state is what you asked for. Actual state is what is running.", "If a pod or a node fails, replacements start automatically.", "Changing the number of replicas scales the app up or down."] },

/* ---------- day streak ---------- */
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
function touchDay() { const t = todayStr(), d = state.day; if (d.last === t) return; d.days = d.last && dayDiff(d.last, t) === 1 ? d.days + 1 : 1; d.last = t; }
function dayStreak() { const d = state.day; return d.last && dayDiff(d.last, todayStr()) <= 1 ? d.days : 0; }

/* ---------- tutorial page (one topic) ---------- */
let curHash = null;
function nav(hh) { curHash = hh; try { if ((location.hash || '').slice(1) !== hh) location.hash = hh; } catch (e) {} }
function route() { let m = null; try { m = /^#level-(\d+)$/.exec(location.hash || ''); } catch (e) {} const L = m && byId(+m[1]); let hh = ''; try { hh = location.hash || ''; } catch (e) {}
  if (L && !L.boss) chapter(L.id); else if (hh === '#glossary') glossary(); else if (hh === '#reference') reference(); else if (hh === '#certificate') certificate(); else if (hh === '#feedback') feedbackPage(); else home(); }
function examplesOf(id) {
  const cfg = MISSIONS[id]; if (!cfg) return [];
  const E = makeEngine(true), S = {}; if (cfg.init) cfg.init(E);
  return cfg.missions.map(M => { if (M.enter) M.enter(E, S); const cmds = answersOf(M, E, S); cmds.forEach(c => E.exec(c)); return { M, cmds }; });
}
function chapter(id) {
  clearSim(); state.run = null; state.article = true; stats();

  app.classList.add('wide');
  app.innerHTML = `<div class="tut">
    <aside class="side" id="side" aria-label="Topics">${sideHTML(id)}</aside>
    <article class="art c-${L.color}">
      <button type="button" class="menu" id="menu" aria-expanded="false" aria-controls="side">Topics</button>
      <p class="crumb">${esc(L.track)} tutorial${L.stage ? ', ' + L.stage.toLowerCase() + ' level' : ''}</p>

      ${pn}
      <div id="secs"></div>
      ${exs.length ? `<section class="sec"><h2>Try it yourself</h2><p>Every example is a real command. Press the button to run it in the playground and watch the picture change.</p>
        ${exs.map((x, i) => `<div class="ex"><h3>Example</h3><p>${fmt(x.M.goal)}</p><pre><code>${esc(x.cmds.join('\n'))}</code></pre><button type="button" class="btn" data-try="${i}">Try it yourself ❯</button>${x.M.after ? `<p class="note">${fmt(x.M.after)}</p>` : ''}</div>`).join('')}
        <div id="try" hidden></div></section>` : ''}
      ${TOPIC[id] ? `<section class="sec rem"><h2>Remember</h2><ul>${TOPIC[id].remember.map(x => `<li>${fmt(x)}</li>`).join('')}</ul></section>` : ''}
      <section class="sec exer"><h2>Exercises</h2>
        <p>Test yourself: ${cfg ? cfg.missions.length + ' missions in the playground, then ' : ''}${prac.length} question${prac.length === 1 ? '' : 's'} and puzzles. Anything you miss comes back.</p>
        <button type="button" class="btn" id="exb">Start the exercises</button>${state.done.has(id) ? '<span class="donemark">✓ Completed</span>' : ''}</section>
      <section class="sec fbk" id="fbk"></section>

  const secs = $('#secs');
  const add = s => { const d = document.createElement('section'); d.className = 'sec'; secs.appendChild(d); RENDER[s.type](s, d); };
  if (SCENE_FOR[id]) add({ type: 'anim', scene: SCENE_FOR[id] });
  learn.forEach(add);
  bindShell();
  $('#exb').onclick = () => startExercises(id);
  app.querySelectorAll('[data-try]').forEach(b => b.onclick = () => {
    const i = +b.dataset.try, t = $('#try');
    const box = b.closest && b.closest('.ex'); if (box && box.after) box.after(t);
    t.hidden = false; clearSim();
    RENDER.lab({ cfg: { free: true, det: true, missions: [], tryText: exs[i].M.goal, feed: exs[i].cmds.slice(),
      init: E => { const S = {}; if (cfg.init) cfg.init(E); cfg.missions.slice(0, i).forEach(M => { if (M.enter) M.enter(E, S); answersOf(M, E, S).forEach(c => E.exec(c)); }); } } }, t);
    if (t.scrollIntoView) t.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });
  });

  nav('level-' + id); track('/topic/' + id + '-' + L.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), L.title);
  window.scrollTo({ top: 0 });
}

function step() {
  clearSim();
  const r = state.run;
  if (r.i >= r.queue.length) return finish();
  const s = r.queue[r.i], L = r.L, n = r.queue.length;
  app.innerHTML = `
  <div class="runbar c-${L.color}"><button class="link" id="back">${L.id && !L.boss ? 'Back to the lesson' : 'Back to home'}</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${r.i}"><i style="width:${(r.i / n) * 100}%"></i></div>
    <span class="count">${r.i + 1} of ${n}</span></div>
  <article class="stage c-${L.color}"><div class="who">${L.id ? `Level ${L.id}${L.stage ? ', ' + L.stage : ''}: ${esc(L.title)}` : esc(L.title)}${r.gateAt > 0 ? `<span class="ph">${PHASE[s.type] || 'Practice'}</span>` : ''}</div><div id="stage"></div></article>`;
  $('#back').onclick = L.id && !L.boss ? () => chapter(L.id) : home;
  app.classList.toggle('wide', s.type === 'lab');
  RENDER[s.type](s, $('#stage'));
  window.scrollTo({ top: 0 });
}
function next() { state.run.i++; step(); }
function cont(el, label) {
  if (state.article) return null;
  const b = document.createElement('button');
  b.className = 'btn'; b.id = 'next'; b.textContent = label || 'Continue'; b.onclick = next;
  el.appendChild(b); b.focus();
  return b;
}

const RENDER = {
  lesson(s, el) {
    el.innerHTML = `<h2>${esc(s.title)}</h2><div class="lesson">${s.visual ? V[s.visual] : ''}${s.body || ''}</div>`;
    cont(el, 'Got it');
  },

  quiz(s, el) {
    const r = state.run;
    const opts = shuffle(s.options.map((t, i) => ({ t, ok: i === s.answer })));
    let locked = false;
    el.innerHTML = `${s.again ? '<span class="again">Let\'s try this one again</span>' : ''}
      <h2 class="q">${fmt(s.q)}</h2>${s.code ? `<pre><code>${esc(s.code)}</code></pre>` : ''}
      <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${fmt(o.t)}</button>`).join('')}</div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    const btns = [...el.querySelectorAll('.opt')];
    btns.forEach(b => b.onclick = () => {
      if (locked) return; locked = true;
      const o = opts[+b.dataset.i];
      if (!s.again) r.quizzes++;
      btns.forEach((x, i) => { x.disabled = true; if (opts[i].ok) x.classList.add('right'); });
      if (o.ok) {
        if (!s.again) r.firstTry++;
        state.streak++; if (s.review) state.missed.delete(s.q); award(s.again ? 5 : 10);
      } else {
        b.classList.add('wrong'); state.streak = 0; state.missed.add(s.q); touchDay(); stats(); save();
        r.queue.push({ ...s, again: true });
      }
      $('#fb', el).innerHTML = `<strong>${o.ok ? 'Correct.' : 'Not quite. This one will come back, and it is saved in Review your mistakes.'}</strong><p>${fmt(s.why)}</p>`;
      cont($('#fb', el));
    });
  },

  order(s, el) {
    const sol = s.items;
    let pool = shuffle(sol.map((_, i) => i)), picked = [], status = [], tries = 0, finished = false, msg = '';
    const draw = () => {
      el.innerHTML = `<h2 class="q">${fmt(s.prompt)}</h2>
        <p class="hint">Tap the lines in order. Tap a placed line to take it back.</p>
        <div class="slots">${sol.map((_, k) => picked[k] === undefined
          ? `<div class="slot"><span class="n">${k + 1}</span></div>`
          : `<button class="slot filled ${status[k] || ''}" data-k="${k}" ${finished ? 'disabled' : ''}><span class="n">${k + 1}</span><code>${esc(sol[picked[k]])}</code></button>`).join('')}</div>
        <div class="pool">${pool.map(id => `<button class="chip" data-id="${id}"><code>${esc(sol[id])}</code></button>`).join('')}</div>
        <div class="row"><button class="btn" id="check" ${picked.length < sol.length || finished ? 'disabled' : ''}>Check order</button>
        ${finished ? '' : '<button class="link" id="reset">Start over</button>'}</div>
        <div class="fb" id="fb" aria-live="polite">${msg}</div>`;
      el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const id = picked.splice(+b.dataset.k, 1)[0]; pool.push(id); status = []; msg = ''; draw(); });
      el.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { const id = +b.dataset.id; pool = pool.filter(x => x !== id); picked.push(id); status = []; msg = ''; draw(); });
      const rs = $('#reset', el); if (rs) rs.onclick = () => { pool = shuffle(sol.map((_, i) => i)); picked = []; status = []; msg = ''; draw(); };
      $('#check', el).onclick = () => {
        tries++;
        status = picked.map((id, k) => id === k ? 'right' : 'wrong');
        const good = status.filter(x => x === 'right').length;
        if (good === sol.length) {
          finished = true; award(tries === 1 ? 15 : 8);
          msg = `<strong>Correct.</strong><p>${fmt(s.why)}</p>`; draw(); cont($('#fb', el));
        } else {
          const w = status.indexOf('wrong');
          msg = `<strong>${good} of ${sol.length} lines are in the right place.</strong><p>Fix the red ones.${tries >= 2 ? ` Hint: line ${w + 1} is <code>${esc(sol[w])}</code>.` : ''}</p>`;
          draw();
        }
      };
    };
    draw();
  },

  match(s, el) {
    const n = s.pairs.length;
    const left = s.pairs.map((p, i) => ({ id: i, t: p[0] }));
    const right = shuffle(s.pairs.map((p, i) => ({ id: i, t: p[1] })));
    let sel = null, done = new Set(), miss = 0, bad = null;
    const draw = () => {
      el.innerHTML = `<h2 class="q">${fmt(s.prompt)}</h2><p class="hint">Tap one on the left, then its match on the right.</p>
        <div class="match">
          <div class="col">${left.map(x => `<button class="mt ${done.has(x.id) ? 'right' : ''} ${sel === x.id ? 'sel' : ''}" data-l="${x.id}" aria-pressed="${sel === x.id}" ${done.has(x.id) ? 'disabled' : ''}>${s.mono ? `<code>${esc(x.t)}</code>` : esc(x.t)}</button>`).join('')}</div>
          <div class="col">${right.map(x => `<button class="mt ${done.has(x.id) ? 'right' : ''} ${bad === x.id ? 'wrong' : ''}" data-r="${x.id}" ${done.has(x.id) ? 'disabled' : ''}>${esc(x.t)}</button>`).join('')}</div>
        </div><div class="fb" id="fb" aria-live="polite"></div>`;
      el.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { sel = +b.dataset.l; draw(); });
      el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
        if (sel === null) return;
        const id = +b.dataset.r;
        if (id === sel) {
          done.add(id); sel = null; draw();
          if (done.size === n) { award(miss === 0 ? 15 : 8); $('#fb', el).innerHTML = `<strong>All matched.</strong><p>${miss === 0 ? 'No misses.' : miss + ' miss' + (miss > 1 ? 'es' : '') + '. Replay this level to get a clean run.'}</p>`; cont($('#fb', el)); }
        } else {
          miss++; bad = id; sel = null; draw();
          later(() => { bad = null; if (done.size < n) draw(); }, 600);
        }
      });
    };
    draw();
  },

  spot(s, el) {
    const sel = new Set(); let checked = false;
    const draw = () => {
      el.innerHTML = `<h2 class="q">${fmt(s.prompt)}</h2><div class="spw">${s.lines.map((l, i) => {
        let cls = sel.has(i) ? 'sel' : '', note = '';
        if (checked) {
          if (l.bad && sel.has(i)) { cls = 'right'; note = `<small>Found it. ${esc(l.why)}</small>`; }
          else if (l.bad) { cls = 'miss'; note = `<small>Missed. ${esc(l.why)}</small>`; }
          else if (sel.has(i)) { cls = 'false'; note = '<small>This line is fine.</small>'; }
        }
        return `<button class="sp ${cls}" data-i="${i}" aria-pressed="${sel.has(i)}" ${checked ? 'disabled' : ''}>${esc(l.t)}${note}</button>`;
      }).join('')}</div>
      <div class="row">${checked ? '' : '<button class="btn" id="chk">Check</button>'}</div><div class="fb" id="fb" aria-live="polite"></div>`;
      el.querySelectorAll('.sp').forEach(b => b.onclick = () => { const i = +b.dataset.i; sel.has(i) ? sel.delete(i) : sel.add(i); draw(); });
      const c = $('#chk', el);
      if (c) c.onclick = () => {
        checked = true;
        const perfect = s.lines.every((l, i) => l.bad === sel.has(i));

        $('#fb', el).innerHTML = `<strong>${perfect ? 'Sharp eyes. You found every problem.' : 'Read the notes above, then keep going.'}</strong>`;
        cont($('#fb', el));
      };
    };
    draw();
  },

  terminal(s, el) {
    const tasks = s.tasks;
    let i = 0, misses = 0;
    el.innerHTML = `<h2 class="q">${fmt(s.title)}</h2>${s.intro ? `<p class="hint">${fmt(s.intro)}</p>` : ''}
      <div class="task" id="task" aria-live="polite"></div>
      <div class="term" id="term" role="log" aria-label="Terminal output"></div>
      <form class="tin" id="tf" autocomplete="off"><span aria-hidden="true">$</span><label class="sr" for="ti">Type a command</label><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn sm" type="submit">Run</button></form>
      <div class="row" style="margin-top:8px"><button class="link" id="show" type="button">Show me the command</button></div><div id="tdone"></div>`;
    const term = $('#term', el), input = $('#ti', el);
    const line = (t, c) => { const d = document.createElement('div'); if (c) d.className = c; d.textContent = t; term.appendChild(d); term.scrollTop = term.scrollHeight; };
    const showTask = () => { $('#task', el).innerHTML = `<b>Task ${i + 1} of ${tasks.length}:</b> ${fmt(tasks[i].ask)}`; };
    line('Practice terminal. Type a command and press Enter.', 'dim');
    showTask(); input.focus();
    $('#show', el).onclick = () => { if (i < tasks.length) { line('Answer: ' + tasks[i].a, 'dim'); input.value = ''; input.focus(); } };
    $('#tf', el).onsubmit = e => {
      e.preventDefault();
      if (i >= tasks.length) return;
      const v = input.value.trim().replace(/\s+/g, ' ');
      if (!v) return;
      line('$ ' + v, 'cmd'); input.value = '';
      const t = tasks[i];
      if (t.ok(v)) {
        t.out.forEach(o => o.startsWith('~') ? line(o.slice(1), 'dim') : line(o));
        award(misses ? 5 : 10); misses = 0; i++;
        if (i >= tasks.length) {
          $('#task', el).innerHTML = '<b>All tasks done.</b>';
          $('#tf', el).style.display = 'none'; $('#show', el).style.display = 'none';
          cont($('#tdone', el));
        } else showTask();
      } else {
        misses++;
        const first = v.split(' ')[0];
        if (first !== 'docker' && first !== 'curl') line(`bash: ${first}: command not found`, 'err');
        else line('That is not quite what the task asks for.' + (misses >= 2 ? ' Hint: ' + t.a.split(' ').slice(0, 3).join(' ') + ' …' : ''), 'err');
      }
      input.focus();
    };
  },

  anim(s, el) {
    const sc = SCENES[s.scene], N = sc.frames.length;
    let k = 0, playing = !REDUCED, tok = 0, contShown = false;
    el.innerHTML = `<h2>${esc(sc.title)}</h2>
      <div class="sc" role="img" aria-label="Animation: ${esc(sc.title)}. The text below describes each step.">${sc.actors.map(a => `<div class="ac" data-a="${a.id}"></div>`).join('')}</div>
      <p class="capt" id="capt" aria-live="polite"></p>
      <div class="row pl"><button class="btn sm out" id="pv">Back</button><button class="btn sm" id="pp"></button><button class="btn sm out" id="nx2">Next</button><span class="count" id="fc"></span></div>
      <div id="dc"></div>`;
    const els = {};
    sc.actors.forEach(a => { els[a.id] = el.querySelector(`[data-a="${a.id}"]`); });
    function apply() {
      sc.actors.forEach(a => {
        const st = { ...a };
        for (let i = 0; i <= k; i++) { const f = sc.frames[i].set; if (f && f[a.id]) Object.assign(st, f[a.id]); }
        const e = els[a.id];
        e.className = `ac ${a.k === 'box' ? 'blk' : a.k} ${st.c || ''}`;
        e.style.left = st.x + '%'; e.style.top = st.y + '%'; e.style.width = st.w + '%'; e.style.height = st.h + '%';
        e.style.opacity = st.o === undefined ? 1 : st.o;
        e.style.transform = `scale(${st.s || 1})`;
        const parts = String(st.t || '').split('\n');
        e.innerHTML = a.k === 'dot' ? '' : `<b>${esc(parts[0])}</b>${parts[1] ? `<small>${esc(parts[1])}</small>` : ''}`;
      });

      if (k === N - 1 && !contShown) { contShown = true; cont($('#dc', el), 'Continue'); }

    }

    $('#nx2', el).onclick = () => { playing = false; tok++; if (k < N - 1) k++; apply(); };
    $('#pp', el).onclick = () => {
      if (playing) { playing = false; tok++; }
      else { if (k === N - 1) k = 0; playing = true; }
      apply(); schedule();
    };
    apply(); schedule();
  },

  lab(s, el) {

    let E, S;
    const boot = () => { E = makeEngine(cfg.det); S = {}; if (cfg.init) cfg.init(E); };
    boot();
    let m = 0, solved = false, reveal = 0, usedAnswer = false, entered = -1, toks = [], hist = [], hi = 0;
    el.innerHTML = `<div class="lab2">
      <ol class="lh" aria-label="How the playground works"><li><b>1</b>Type a command, or tap one</li><li><b>2</b>Press Run</li><li><b>3</b>Watch the picture change</li></ol>

        <div class="xpl" id="xpl"></div>
